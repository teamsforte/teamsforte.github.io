        '<p class="hint" style="margin-top:10px">Each item: name, then unit · price · your cost.</p>'+
        '<div class="rbrows">'+(b.items||[]).map(rbRow).join('')+'</div><button type="button" class="btn ghost block mt" data-m="rbadd" data-t="'+t+'">'+ICON.plus+'Add item</button></div>';}).join('')+
      '<p class="hint">Your cost (materials + labor) is only used for the profit estimate in this app. Customers never see it.</p></div>';
  }
  function rbRow(it){return '<div class="rb" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)" data-key="'+esc(it.key||'')+'"><input class="in" data-rn value="'+esc(it.name||'')+'" placeholder="Item name" aria-label="Item name">'+
    '<div class="row" style="gap:6px;margin-top:6px"><div><label class="f" style="margin-top:0">Unit</label><input class="in" data-ru value="'+esc(it.unit||'each')+'"></div><div><label class="f" style="margin-top:0">Price</label><input class="in money" data-rp inputmode="decimal" value="'+(it.price!=null?it.price:'')+'" placeholder="$"></div><div><label class="f" style="margin-top:0">Your cost</label><input class="in money" data-rc inputmode="decimal" value="'+(it.cost?it.cost:'')+'" placeholder="$"></div></div></div>';}
  function readRepairBook(){
    var trades={};document.querySelectorAll('.rbt').forEach(function(box){var items=[];
      box.querySelectorAll('.rb').forEach(function(r){var n=r.querySelector('[data-rn]').value.trim();if(!n)return;items.push({key:r.getAttribute('data-key')||'',name:n,unit:r.querySelector('[data-ru]').value.trim()||'each',price:Number(r.querySelector('[data-rp]').value)||0,cost:Number(r.querySelector('[data-rc]').value)||0});});
      trades[box.getAttribute('data-t')]={min:Number(box.querySelector('[data-rbmin]').value)||0,items:items};});
    return {trades:trades};
  }
  function wireRepairBook(){var seg=document.getElementById('rbtr');if(!seg)return;
    seg.onclick=function(ev){var b=ev.target.closest('[data-tr]');if(!b)return;var t=b.getAttribute('data-tr');
      seg.querySelectorAll('[data-tr]').forEach(function(z){z.classList.toggle('on',z===b);});document.querySelectorAll('.rbt').forEach(function(box){box.hidden=box.getAttribute('data-t')!==t;});};}

  /* ---------- clicks ---------- */
  function click(t,ev){
    if(ev&&t.tagName==='A'&&t.getAttribute('href')==='#')ev.preventDefault();
    var a=t.getAttribute('data-m');
    if(a==='retry'){M.failed=false;render();return;}
    if(a==='editcust'){editCustSheet();return;}
    if(a==='ghlsync'){call('ghlSyncNow',{id:M.qid}).then(function(r){mergeQ(r);render();toast('Synced to GoHighLevel');}).catch(function(e){load().then(render);err(e);});return;}
    if(a==='edititems'){editItemsSheet();return;}
    if(a==='qrooms'){var xr=q();roomsSheet(xr.rooms,xr.items||[],tradeOf(xr),function(rooms,items){saveQ({rooms:rooms,items:items,contractPrice:repairTotal(items,tradeOf(xr))},'Rooms saved');});return;}
    if(a==='approverep'){t.disabled=true;saveQ({status:'approved'},'Approved').then(function(){M.qfilter='approved';call('list').then(function(d){S.jobs=d.jobs||[];cacheMerge('list',d);});}).catch(function(){t.disabled=false;});return;}
    if(a==='propose'){proposeSheet();return;}
    if(a==='conew'){coSheet('');return;}
    if(a==='coedit'){coSheet(t.getAttribute('data-co'));return;}
    if(a==='cosend'){coSendSheet(t.getAttribute('data-co'));return;}
    if(a==='jtab'){M.jobTab=t.getAttribute('data-v');render();return;}
    if(a==='cxl'){cancelContract();return;}
    if(a==='followtog'){var xf=q();saveQ({followOff:!xf.followOff},xf.followOff?'Reminders on':'Reminders off for this customer').catch(function(){});return;}
    if(a==='adadd'){document.getElementById('adrows').insertAdjacentHTML('beforeend',adRow({unit:'each',basis:'manual'}));return;}
    if(a==='adrm'){var ar=t.closest('.adr');if(ar)ar.remove();return;}
    if(a==='sigclr'){var cv=document.getElementById('csig');if(cv){cv.getContext('2d').clearRect(0,0,cv.width,cv.height);cv.removeAttribute('data-drawn');}return;}
    if(a==='reqpay'){reqPaySheet();return;}
    if(a==='recpay'){recPaySheet();return;}
    if(a==='delpay'){if(!confirm('Remove this payment record?'))return;call('deletePayment',{id:q().id,paymentId:t.getAttribute('data-pid')}).then(function(r){mergeQ(r);render();toast('Removed');}).catch(err);return;}
    if(a==='savesched'){saveQ({installDate:document.getElementById('sd').value,crew:document.getElementById('sc').value},'Schedule saved');return;}
    if(a==='editcosts'){costsSheet();return;}
    if(a==='addinsp'){addInspSheet(M.qid);return;}
    if(a==='insp'){inspSheet(t.getAttribute('data-id'));return;}
    if(a==='report'){reportSheet();return;}
    if(a==='revmail'){t.disabled=true;call('reviewEmail',{id:M.qid}).then(function(r){mergeQ(r);render();toast('Review request sent');}).catch(function(e){t.disabled=false;err(e);});return;}
    if(a==='warranty'){var wx=q();saveQ({warrantyDone:!wx.warrantyDone},!wx.warrantyDone?'Warranty marked registered':'Saved');return;}
    if(a==='openjobq'){S.tab='quotes';store('tfp_tab','quotes');M.qid=t.getAttribute('data-id');M.view='quote';render();window.scrollTo(0,0);return;}
    if(a==='crewopen'){M.qid=t.getAttribute('data-id');M.view='crewjob';render();window.scrollTo(0,0);return;}
    if(a==='crewback'){M.view='list';render();window.scrollTo(0,0);return;}
    if(a==='crewreload'){M.crewLoaded=false;M.crewFailed=false;render();return;}
    if(a==='crewphotos'){var cj=M.crewJobs.filter(function(z){return z.id===M.qid;})[0];S.tab='photos';store('tfp_tab','photos');S.jobId=cj.photoJobId;S.view='job';
      if(!S.jobs.some(function(j){return j.id===cj.photoJobId;})){S.jobWait=true;call('list').then(function(d){S.jobs=d.jobs||[];cacheMerge('list',d);S.jobWait=false;render();},function(e){S.jobWait=false;render();toast(e.message,true);});}render();window.scrollTo(0,0);return;}
    if(a==='crewinsp'){addInspSheet(M.qid);return;}
    if(a==='crewnote'){var ni=document.getElementById('cnote');var nv=ni.value.trim();if(!nv)return;t.disabled=true;
      call('crewNote',{id:M.qid,note:nv}).then(function(){var cj2=M.crewJobs.filter(function(z){return z.id===M.qid;})[0];cj2.events=(cj2.events||[]).concat([{e:'crew: '+nv+' ('+S.user.name+')',t:new Date().toISOString()}]);render();toast('Sent to the office');}).catch(function(e){t.disabled=false;err(e);});return;}
    if(a==='stripetest'){var sf2=document.getElementById('sf');t.disabled=true;
      saveSettings(sf2,(document.querySelector('#aenv .on')||{getAttribute:function(){return 'sandbox';}}).getAttribute('data-env')).then(function(){return call('stripeTest');}).then(function(r){toast('Stripe is connected ('+r.mode+' mode)');})
        .catch(function(e){if(e.message!=='bad')err(e);}).then(function(){var b=document.querySelector('[data-m=stripetest]');if(b)b.disabled=false;});return;}
    if(a==='ghltest'){var gf=document.getElementById('sf');t.disabled=true;
      saveSettings(gf,(document.querySelector('#aenv .on')||{getAttribute:function(){return 'sandbox';}}).getAttribute('data-env')).then(function(){return call('ghlPipelines');}).then(function(list){
        var g=M.settings.ghl||{};var box=document.getElementById('ghlsel');
        function sel(name,opts,cur){return '<select class="in" name="'+name+'">'+opts.map(function(o){return '<option value="'+esc(o.id)+'"'+(o.id===cur?' selected':'')+'>'+esc(o.name)+'</option>';}).join('')+'</select>';}
        var pl=list.filter(function(x){return x.id===g.pipelineId;})[0]||list[0];
        if(box&&pl)box.innerHTML='<label class="f">Pipeline</label>'+sel('g_pipelineId',list,g.pipelineId)+'<label class="f">When a quote is sent</label>'+sel('g_stageQuote',pl.stages,g.stageQuote)+'<label class="f">When a job is approved</label>'+sel('g_stageWon',pl.stages,g.stageWon);
        toast('GoHighLevel is connected');}).catch(function(e){if(e.message!=='bad')err(e);}).then(function(){var b=document.querySelector('[data-m=ghltest]');if(b)b.disabled=false;});return;}
    if(a==='addperson'){var pb=document.getElementById('people');var np=document.getElementById('nopeople');if(np)np.remove();pb.insertAdjacentHTML('beforeend',personRow({role:'crew'}));return;}
    if(a==='savepeople'){var ppl=[];document.querySelectorAll('#people .person').forEach(function(r){var nm=r.querySelector('[data-pn]').value.trim(),pn=r.querySelector('[data-pp]').value.trim();if(!nm&&!pn)return;ppl.push({id:r.getAttribute('data-id')||undefined,name:nm,role:r.querySelector('[data-pr]').value,pin:pn});});
      t.disabled=true;call('saveUsers',{users:ppl}).then(function(){loadPeople();toast('People saved');}).catch(err).then(function(){t.disabled=false;});return;}
    if(a==='rbadd'){var box=document.querySelector('.rbt[data-t="'+t.getAttribute('data-t')+'"] .rbrows');if(box)box.insertAdjacentHTML('beforeend',rbRow({unit:'each'}));return;}
    if(a==='newest'){newEst();M.view='new';render();window.scrollTo(0,0);var ea=document.getElementById('ea');if(ea)ea.focus();return;}
    if(a==='pricing'){M.view='pricing';render();window.scrollTo(0,0);return;}
    if(a==='measure'){measure();return;}
    if(a==='colors'){colorBook(1,null,'');return;}
    if(a==='addroof'){M.est.roofs.push({n:M.est.roofs.length===1?'Garage':'Section '+(M.est.roofs.length+1),s:0,p:'4/12'});render();return;}
    if(a==='rmroof'){M.est.roofs.splice(+t.getAttribute('data-i'),1);render();return;}
    if(a==='addnear'){var nx=M.est.m&&M.est.m.nearby&&M.est.m.nearby[+t.getAttribute('data-i')];if(nx){M.est.roofs.push({n:nx.row.n,s:nx.row.s,p:nx.row.p,f:nx.row.f});M.est.m.nearby.splice(+t.getAttribute('data-i'),1);}render();return;}
    if(a==='saveest'){saveEst(t.getAttribute('data-v')==='email');return;}
    if(a==='share'){shareSheet();return;}
    if(a==='qf'){M.qfilter=t.getAttribute('data-v');render();return;}
    if(a==='addlink'){addLinkSheet();return;}
    if(a==='openq'){M.qid=t.getAttribute('data-id');M.view='quote';M.draft=null;render();window.scrollTo(0,0);return;}
    if(a==='back'){M.view='list';render();window.scrollTo(0,0);return;}
    if(a==='approve'){approve();return;}
    if(a==='archive'){confirmBox('Archive this quote?','It will be hidden from your Quotes list. Orders already placed are kept.','Archive').then(function(ok){if(!ok)return;
      call('deleteQuote',{id:M.qid}).then(function(){M.quotes=M.quotes.filter(function(x){return x.id!==M.qid;});M.view='list';render();toast('Archived');}).catch(err);});return;}
    if(a==='recalc'){recalc();return;}
    if(a==='measuretool'){measureTool();return;}
    if(a==='line'){lineSheet(+t.getAttribute('data-i'));return;}
    if(a==='addline'){addLineSheet();return;}
    if(a==='editjob'){editJobSheet();return;}
    if(a==='status'){var sv=t.getAttribute('data-v'),go=function(){saveQ({status:sv},sv==='done'?'Marked done':'Reopened');};
      if(sv!=='done')return go();var xs=q(),st2=M.settings||{},mails=st2.autoReview&&st2.reviewLink&&/@/.test(xs.email||'')&&!xs.reviewAt;
      confirmBox('Mark this job done?',mails?'We\u2019ll email '+(xs.name||'the customer')+' a review request.':'You can reopen it later.','Mark done').then(function(ok){if(ok)go();});return;}
    if(a==='photos'){var x=q();S.tab='photos';store('tfp_tab','photos');S.jobId=x.photoJobId;S.view='job';
      if(!S.jobs.some(function(j){return j.id===x.photoJobId;})){S.jobWait=true;call('list').then(function(d){S.jobs=d.jobs||[];cacheMerge('list',d);S.jobWait=false;render();},function(e){S.jobWait=false;render();toast(e.message,true);});}render();window.scrollTo(0,0);return;}
    if(a==='order'){var xo=q(),ov0=t.getAttribute('data-v');
      if(inCancel(xo)){confirmBox('Cancellation period still open','The customer can cancel until midnight '+prettyDay(xo.cancelBy)+'. If you order now and they cancel, you may be stuck with the materials.','Order anyway').then(function(ok){if(ok)orderSheet(ov0);});return;}
      orderSheet(ov0);return;}
    if(a==='openo'){orderDetail(t.getAttribute('data-id'));return;}
    if(a==='mtab'){M.money=t.getAttribute('data-v');render();return;}
    if(a==='price'){priceSheet(t.getAttribute('data-k'));return;}
    if(a==='refresh'){t.disabled=true;t.textContent='Refreshing…';call('refreshPrices').then(function(r){return load().then(function(){render();toast(r.updated+' prices updated'+(r.failed.length?', '+r.failed.length+' failed':''));});}).catch(function(e){render();err(e);});return;}
    if(a==='settings'){M.mview='settings';render();window.scrollTo(0,0);return;}
    if(a==='mhome'){M.mview='home';render();window.scrollTo(0,0);return;}
    if(a==='addsup'){document.getElementById('sups').insertAdjacentHTML('beforeend',supRow({name:'',email:''}));return;}
    if(a==='abctest'){var f=document.getElementById('sf');t.disabled=true;
      saveSettings(f,document.querySelector('#aenv .on').getAttribute('data-env')).then(function(){return call('abcTest');}).then(function(r){toast('ABC login works ('+(r.env==='production'?'Live':'Test')+')');})
        .catch(function(e){if(e.message!=='bad')err(e);}).then(function(){var b=document.querySelector('[data-m=abctest]');if(b)b.disabled=false;});return;}
    if(a==='branches'){var box=document.getElementById('brs');box.innerHTML='<div class="loading" style="padding:16px"><div class="spin dk"></div></div>';
      saveSettings(document.getElementById('sf'),document.querySelector('#aenv .on').getAttribute('data-env')).then(function(){return call('abcBranches',{state:'CT'});}).then(function(list){
        box=document.getElementById('brs');
        box.innerHTML=list.length?list.map(function(b){return '<button type="button" class="res" data-m="pickbr" data-n="'+esc(b.number)+'" data-nm="'+esc(b.name||b.city)+'"><b>'+esc(b.name||'Branch '+b.number)+'</b><span>#'+esc(b.number)+' · '+esc(b.city)+'</span></button>';}).join(''):'<p class="hint">No branches found.</p>';
      }).catch(function(e){var bx=document.getElementById('brs');if(bx)bx.innerHTML='';if(e.message!=='bad')err(e);});return;}
    if(a==='pickbr'){var fm=document.getElementById('sf');fm.elements.branch.value=t.getAttribute('data-n');fm.elements.branchName.value=t.getAttribute('data-nm');document.getElementById('brs').innerHTML='';toast('Branch picked. Tap Save settings.');return;}
    if(a==='hook'){t.disabled=true;call('abcRegisterWebhook').then(function(r){M.settings=r;render();toast('Order updates turned on');}).catch(function(e){t.disabled=false;err(e);});return;}
    if(a==='disc'){confirmBox('Disconnect ABC Supply?','Your ABC login is removed from the app. Prices and past orders stay.','Disconnect').then(function(ok){if(!ok)return;
      call('saveSettings',{abc:{disconnect:true}}).then(function(r){M.settings=r;render();toast('Disconnected');}).catch(err);});return;}
  }

  return {
    render:renderMat, click:click, load:load, loadCrew:loadCrew, apply:apply, applyCrew:applyCrew, optQuote:function(a){var x=null;(M.quotes||[]).forEach(function(z){if(z.id===a.id)x=z;});if(!x)return null;Object.keys(a).forEach(function(k){if(k!=='id'&&k!=='base'&&k!=='send')x[k]=a[k];});return x;}, optCrewNote:function(a){var x=null;(M.crewJobs||[]).forEach(function(z){if(z.id===a.id)x=z;});if(!x)return null;return {};},
    reset:function(){M.loaded=false;M.quotes=[];M.orders=[];M.prices=[];M.view='list';M.mview='home';},
    home:function(){M.view='list';M.mview='home';},
    newCount:function(){return M.quotes.filter(function(x){return x.status==='new';}).length;}
  };
})();


/* ---------- start ---------- */
function cacheMerge(part,d){var c=cacheGet('boot');if(c){c[part]=d;cacheSet('boot',c);}}
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
var saved=load('tfp_pass');
if(saved){S.pass=saved;boot();}else{render();}
})();
</script>
