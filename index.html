<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Forte</title>
<meta name="theme-color" content="#13202F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Team Forte">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#13202F;--navy2:#1B2B3D;--red:#FF5440;--red-dk:#E23E2B;--ink:#1C2430;--muted:#5B6675;--line:#DDE2E8;--slate:#F2F4F7;--white:#fff;--green:#1F9D55;--green-bg:#E5F6EC;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Montserrat,"Segoe UI",Arial,sans-serif;background:var(--slate);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
.bar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 0 10px}
.bar .wrap{display:flex;align-items:center;gap:10px;padding-bottom:0;min-height:40px}
.brand{font-weight:800;letter-spacing:.06em;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b{color:var(--red)}
.bar .link{color:#C4CCD6;font-size:13px;font-weight:600;padding:8px 4px}
.back{display:flex;align-items:center;gap:4px;color:#fff;font-weight:700;font-size:15px;padding:8px 8px 8px 0}
.back svg{width:20px;height:20px}
.bar-title{flex:1;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;margin-right:48px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:10px;font-weight:700;font-size:15px;background:var(--red);color:#fff;transition:background .15s}
.btn:active{background:var(--red-dk)}
.btn.block{width:100%}
a.btn{text-decoration:none}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.dark{background:var(--navy);color:#fff}
.btn.danger{background:#fff;color:#C62828;border:1px solid #F3C4C4}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn svg{width:18px;height:18px}
h1{font-size:22px;font-weight:800;margin:20px 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0}
.card h2{font-size:16px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 small{font-weight:600;color:var(--muted);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;color:var(--ink)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--slate);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{min-height:40px;border-radius:8px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(19,32,47,.15)}
.stats{display:flex;gap:10px;margin:14px 0 6px}
.stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:12px;white-space:nowrap;color:var(--muted);font-weight:600}
.jobs{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.job{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;width:100%}
.job .th{width:76px;height:76px;border-radius:9px;background:var(--slate) center/cover no-repeat;flex:none;display:flex;align-items:center;justify-content:center;color:#9AA5B1}
.job .th svg{width:28px;height:28px}
.job .info{flex:1;min-width:0}
.job .t{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .m{color:var(--muted);font-size:13px;margin:2px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--slate);color:var(--muted);letter-spacing:.02em}
.pill.live{background:var(--green-bg);color:var(--green)}
.pill.home{background:#FFE9E5;color:var(--red-dk)}
.chev{color:#9AA5B1;flex:none}
.empty{text-align:center;color:var(--muted);padding:40px 16px;background:#fff;border:1px dashed var(--line);border-radius:var(--r);margin-top:12px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0;padding-top:0}
.toggle .tl b{display:block;font-size:15px}
.toggle .tl span{font-size:13px;color:var(--muted)}
.sw{position:relative;width:52px;height:32px;flex:none;border-radius:999px;background:#C9D1DA;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(20px)}
.stage{margin-top:16px}
.stage:first-of-type{margin-top:0}
.stage-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.stage-h b{font-size:14px;text-transform:uppercase;letter-spacing:.08em}
.stage-h span{font-size:12px;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--slate)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .star{position:absolute;left:6px;top:6px;background:var(--red);color:#fff;border-radius:999px;font-size:10px;font-weight:800;padding:2px 7px;letter-spacing:.04em}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add{aspect-ratio:1;border-radius:9px;border:2px dashed #B9C3CE;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-weight:700;font-size:12px;background:#FAFBFC}
.add svg{width:26px;height:26px;color:var(--red)}
label.f{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
label.f:first-child{margin-top:0}
label.f small{font-weight:500;color:var(--muted)}
.in{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:16px;-webkit-appearance:none;appearance:none}
.in:focus{outline:2px solid rgba(255,84,64,.35);border-color:var(--red)}
textarea.in{min-height:84px;resize:vertical}
.row{display:flex;gap:10px}
.row>*{flex:1}
.mt{margin-top:16px}
.drive{display:flex;align-items:center;gap:8px;color:var(--navy);font-weight:700;font-size:14px;text-decoration:none;padding:12px 0}
.drive svg{width:18px;height:18px}
/* sheets */
.ov{position:fixed;inset:0;z-index:50;background:rgba(19,32,47,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.grab{width:40px;height:5px;border-radius:3px;background:#D0D6DD;margin:4px auto 12px}
.sheet h3{font-size:18px;font-weight:800;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}
.x{width:42px;height:42px;border-radius:50%;background:var(--slate);display:flex;align-items:center;justify-content:center}
.x svg{width:18px;height:18px}
.big{width:100%;border-radius:12px;background:var(--slate);display:block;max-height:52vh;object-fit:contain}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.acts .btn{min-height:44px;font-size:14px;padding:0 10px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.ctile{display:block;text-align:left;min-width:0}
.ctile img{width:100%;aspect-ratio:1;border-radius:10px;display:block;background:#333}
.ctile span{display:block;font-size:12px;font-weight:700;margin-top:5px;line-height:1.25}
.ctile.on img{outline:3px solid var(--red);outline-offset:2px}
.cbig{aspect-ratio:1;object-fit:cover;max-height:none}
.vizov{position:fixed;inset:0;z-index:60;background:#fff;overflow:auto;-webkit-overflow-scrolling:touch}
.vizbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--navy);color:#fff}
.vizbar span{flex:1;font-size:12px;opacity:.75}
.vizbody{padding:0 8px calc(16px + env(safe-area-inset-bottom))}
#visualizer iframe{width:100% !important;border:0}
.shov{flex-direction:column;overflow:hidden}
.ocf{flex:1;width:100%;border:0;min-height:0;background:#fff}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* progress + toast */
.prog{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--navy);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.prog .wrap{padding-bottom:0}
.prog .l{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:8px}
.prog .track{height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.prog .fill{height:100%;background:var(--red);transition:width .3s}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fade .2s}
.toast.err{background:#B3261E}
/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:var(--navy);color:#fff;padding:24px}
.login .box{max-width:380px;margin:0 auto;width:100%}
.login .logo{font-weight:800;font-size:28px;letter-spacing:.08em;margin-bottom:4px}
.login .logo b{color:var(--red)}
.login p{color:#C4CCD6;margin:0 0 28px}
.login .in{background:#fff;color:var(--ink);text-align:center;font-size:20px;letter-spacing:.2em;font-weight:700}
.login .remember{display:flex;align-items:center;gap:8px;color:#C4CCD6;font-size:14px;margin:14px 0 18px}
.login .remember input{width:18px;height:18px;accent-color:var(--red)}
.login .err{color:#FFB4A8;font-size:14px;min-height:20px;margin-top:10px;text-align:center}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite}
.spin.dk{border-color:rgba(19,32,47,.15);border-top-color:var(--red)}
@keyframes rot{to{transform:rotate(360deg)}}
.loading{display:flex;justify-content:center;padding:60px 0}
.foot{text-align:center;margin-top:26px}
.foot a{color:var(--navy);font-weight:700;font-size:14px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* bottom tabs */
body.has-tabs .wrap{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
body.has-tabs .bar .wrap,body.has-tabs .prog .wrap{padding-bottom:0}
.row{align-items:flex-end}
body.has-tabs .prog{bottom:calc(62px + env(safe-area-inset-bottom))}
body.has-tabs .toast{bottom:calc(80px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:0 0 env(safe-area-inset-bottom)}
.tabs .in2{display:flex;width:100%;max-width:640px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:700;color:#7A8594;position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--red)}
.tab .dot{position:absolute;top:5px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center}
/* materials */
.money{font-variant-numeric:tabular-nums}
.q{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:10px}
.q .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.q .nm{font-weight:800;font-size:16px}
.q .ad{color:var(--muted);font-size:13px;margin:2px 0 8px}
.q .rg{font-weight:800;font-size:15px;white-space:nowrap}
.pill.new{background:#FFE9E5;color:var(--red-dk)}
.pill.approved{background:#E7EEFF;color:#2B4FC7}
.pill.ordered,.pill.Sent,.pill.Requested,.pill.Scheduled,.pill.Pending{background:#FFF4D6;color:#8A5A00}
.pill.done,.pill.Delivered,.pill.Picked{background:var(--green-bg);color:var(--green)}
.pill.Canceled,.pill.Backordered,.pill.Attempted{background:#FDE7E7;color:#B3261E}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0}
.kv span{color:var(--muted)}
.kv b{text-align:right}
.big-n{font-size:28px;font-weight:800;line-height:1.1}
.pkg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pkg button{border:2px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;background:#fff}
.pkg button b{display:block;font-size:14px}
.pkg button span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.pkg button.on{border-color:var(--red);background:#FFF6F4}
.meas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meas label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}
.meas label i{font-style:normal;font-weight:700;font-size:10px;color:#8A5A00;background:#FFF4D6;border-radius:4px;padding:1px 5px;margin-left:4px}
.meas .in{min-height:42px;padding:8px 10px}
.ln{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.ln:first-child{border-top:0}
.ln .l1{flex:1;min-width:0}
.ln .l1 b{display:block;font-size:14px;font-weight:700}
.ln .l1 span{font-size:12px;color:var(--muted)}
.ln .l1 em{font-style:normal;font-size:10px;font-weight:800;color:#8A5A00;background:#FFF4D6;border-radius:4px;padding:1px 5px;margin-left:4px}
.ln .l2{text-align:right;font-weight:800;font-size:14px;white-space:nowrap}
.ln .l2 span{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.cat{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.cat:first-child{margin-top:0}
.tot{border-top:2px solid var(--ink);margin-top:8px;padding-top:8px}
.tot .kv{border:0;padding:3px 0}
.tot .kv.grand{font-size:17px;font-weight:800}
.src{font-size:10px;font-weight:800;border-radius:4px;padding:2px 6px;letter-spacing:.03em}
.src.abc{background:var(--green-bg);color:var(--green)}
.src.manual{background:#E7EEFF;color:#2B4FC7}
.src.starter{background:#FFF4D6;color:#8A5A00}
.note{background:#FFF8E6;border:1px solid #F3DFA8;border-radius:10px;padding:10px 12px;font-size:13px;color:#5C4400;margin:10px 0}
.note.warn{background:#FFF1EF;border-color:#F6C7BF;color:#7A2316}
.co{border-top:1px solid var(--line);padding:8px 0 4px}
.co:first-of-type{border-top:0}
.adds{display:grid;gap:6px}
.add{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.add label{flex:1;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;min-width:0}
.add label input{width:20px;height:20px;accent-color:var(--red);flex:none}
.add label small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.add .in{flex:0 0 76px;min-height:38px;padding:6px 8px}
.add i{font-style:normal;font-size:12px;color:var(--muted);flex:0 0 36px}
.sigpad{width:100%;height:120px;border:2px dashed #B9C3CE;border-radius:10px;background:#fff;touch-action:none;display:block;margin-top:6px}
.note.ok{background:var(--green-bg);border-color:#BFE6CF;color:#145C34}
.res{display:block;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.res b{display:block}
.res span{font-size:12px;color:var(--muted)}
.icon-btn{display:inline-flex;align-items:center;gap:6px;color:#fff;font-weight:700;font-size:14px;padding:8px 2px}
.icon-btn svg{width:20px;height:20px}
.meter{height:8px;border-radius:4px;background:var(--slate);overflow:hidden;margin-top:8px}
.meter div{height:100%;background:var(--red)}
button,a,.btn,[data-act],[data-m],input,select,label{touch-action:manipulation}
button,.btn,.job,.chip,.tab,.add,.ph,[data-act],[data-m]{transition:transform .08s ease,filter .08s ease,opacity .08s}
button:active,.btn:active,.job:active,.chip:active,.tab:active,.add:active,.ph:active,[data-act]:active,[data-m]:active{transform:scale(.97);filter:brightness(.93)}
.busy{position:relative;pointer-events:none;opacity:.8}
.busy::after{content:"";position:absolute;right:10px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;border:2.5px solid rgba(128,128,128,.3);border-top-color:#FF5440;animation:rot .7s linear infinite}
.add.drv{border-style:solid;border-color:#D5DDE6;background:#fff}
.dv .sheet{max-width:760px}
.dv-tabs{display:flex;gap:6px;margin:0 0 10px;overflow-x:auto}
.dv-tabs button{flex:none;padding:9px 14px;border-radius:99px;background:var(--slate);font-weight:700;font-size:13px;color:var(--ink)}
.dv-tabs button.on{background:var(--ink);color:#fff}
.dv-search{margin:0 0 10px}
.dv-path{display:flex;flex-wrap:wrap;gap:2px;align-items:center;font-size:13px;margin:0 0 8px;color:var(--muted)}
.dv-path button{padding:6px 6px;font-weight:700;color:var(--ink);border-radius:6px}
.dv-path i{font-style:normal;opacity:.5}
.dv-fl{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}
.dv-f{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px;border-radius:10px;background:#FAFBFC;border:1px solid #E3E8EE;font-weight:700;font-size:14px;color:var(--ink);min-height:48px}
.dv-f svg{width:20px;height:20px;flex:none;color:#7A8899}
.dv-f span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dv-bar{display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px;font-size:13px;color:var(--muted)}
.dv-bar button{font-weight:800;color:#FF5440;padding:8px 4px}
.dv-g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media(min-width:560px){.dv-g{grid-template-columns:repeat(5,1fr)}}
.dv-p{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--slate)}
.dv-p img{width:100%;height:100%;object-fit:cover;display:block}
.dv-p .nm{position:absolute;left:4px;right:4px;bottom:4px;font-size:10px;color:#fff;background:rgba(0,0,0,.5);border-radius:4px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function img(id,w){return S.prev[id]||('https://lh3.googleusercontent.com/d/'+encodeURIComponent(id)+'=w'+(w||400));}
function store(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}}
function load(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function month(d){if(!d)return'';var m=String(d).split('-');var names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return (names[(+m[1]||1)-1]||'')+' '+m[0];}
function thisMonth(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);}
function job(){for(var i=0;i<S.jobs.length;i++)if(S.jobs[i].id===S.jobId)return S.jobs[i];return null;}
function sortJobs(){S.jobs.sort(function(a,b){return String(b.date).localeCompare(String(a.date))||String(b.created||'').localeCompare(String(a.created||''));});}
function coverOf(j){
  if(j.coverId&&j.photos.some(function(p){return p.id===j.coverId;}))return j.coverId;
  var a=j.photos.filter(function(p){return p.stage==='after';});
  return a.length?a[0].id:(j.photos.length?j.photos[j.photos.length-1].id:'');
}
function photosOf(j,stage){return j.photos.filter(function(p){return p.stage===stage;});}

var CACHED={boot:1};
function ckey(m){return 'tfc_'+m;}
function cacheSet(m,d){try{localStorage.setItem(ckey(m),JSON.stringify({t:Date.now(),d:d}));}catch(e){}}
function cacheGet(m){try{var v=JSON.parse(localStorage.getItem(ckey(m))||'null');return v&&v.d;}catch(e){return null;}}
function cacheClear(){try{Object.keys(localStorage).forEach(function(k){if(k.indexOf('tfc_')===0)localStorage.removeItem(k);});}catch(e){}}
function netPill(on,txt){var p=document.querySelector('.netpill');if(!on){if(p)p.remove();return;}if(!p){p=document.createElement('div');p.className='netpill';document.body.appendChild(p);}p.textContent=txt;}
/* ---- network: quick timeouts, a send queue for edits, a photo upload queue ---- */
var NET={boot:'',off:false};
var RO={boot:1,list:1,matList:1,ping:1,crewJobs:1,users:1,driveBrowse:1,driveThumbs:1,abcSearch:1,abcBranches:1,measure:1,ghlPipelines:1,stripeTest:1,abcTest:1};
function netErr(msg){var e=new Error(msg);e.net=true;return e;}
function rawCall(method,args,ms){
  var body=JSON.stringify({pass:S.pass,tok:load('tfp_tok')||'',method:method,args:args||{}});
  var ctl=window.AbortController?new AbortController():null;
  var tmo=setTimeout(function(){if(ctl)ctl.abort();},ms||(method==='uploadPhoto'?90000:RO[method]?15000:20000));
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body,redirect:'follow',credentials:'omit',signal:ctl?ctl.signal:undefined})
    .then(function(r){clearTimeout(tmo);if(!r.ok)throw netErr('Google is busy. Try again in a moment.');return r.text();},
          function(){clearTimeout(tmo);NET.off=true;throw netErr(navigator.onLine===false?'No signal. Your saved info is still here — try again when you have signal.':'Couldn’t reach Google. Check your signal and try again.');})
    .then(function(s){NET.off=false;var r;try{r=JSON.parse(s);}catch(e){throw netErr('Unexpected reply from Google. Try again.');}
      if(r.tok)store('tfp_tok',r.tok);
      if(r.ok)return r.data;
      if(r.error==='WRONG_PASSCODE'){logout('That passcode didn’t work.');throw new Error('Wrong passcode');}
      throw new Error(r.error);});
}
var OBX='tfq_out';
function outbox(){try{return JSON.parse(localStorage.getItem(OBX)||'[]');}catch(e){return [];}}
function outboxSet(a){try{localStorage.setItem(OBX,JSON.stringify(a));}catch(e){}}
function queueable(m,a){a=a||{};if(m==='saveJob')return !!a.id;if(m==='saveQuote')return !!a.id&&!a.send;return m==='crewNote'||m==='updatePhoto'||m==='reorderPhotos';}
function findJob(id){var j=null;S.jobs.forEach(function(x){if(x.id===id)j=x;});return j;}
/* what the screen shows right away for a queued change (and again after fresh data arrives, until it is sent) */
var OPT={
  saveJob:function(a){var j=findJob(a.id);if(!j)return null;Object.keys(a).forEach(function(k){if(k!=='id'&&k!=='base')j[k]=a[k];});return j;},
  saveQuote:function(a){return MAT.optQuote(a);},
  crewNote:function(a){return MAT.optCrewNote(a);},
  updatePhoto:function(a){var hit=null;S.jobs.forEach(function(j){(j.photos||[]).forEach(function(p){if(p.id===a.id){if(a.stage)p.stage=a.stage;if(a.caption!=null)p.caption=a.caption;hit=p;}});});return hit?{id:hit.id,stage:hit.stage,caption:hit.caption}:null;},
  reorderPhotos:function(a){var j=findJob(a.jobId);if(!j||!a.stages)return null;var pos={},rank={before:0,during:1,after:2};
    ['before','during','after'].forEach(function(st){(a.stages[st]||[]).forEach(function(id,k){pos[id]={st:st,k:k};});});
    (j.photos||[]).forEach(function(p){if(pos[p.id])p.stage=pos[p.id].st;});
    j.photos.sort(function(x,y){var px=pos[x.id],py=pos[y.id];return (rank[x.stage]-rank[y.stage])||((px?px.k:1e6)-(py?py.k:1e6));});return [];}
};
function reapplyQueued(){outbox().forEach(function(it){try{if(OPT[it.m])OPT[it.m](it.a);}catch(e){}});PQ.inject();}
function netStatus(){
  var o=outbox().length,ph=PQ.items.length,parts=[];
  if(ph)parts.push((PQ.running?'Uploading ':'')+ph+' photo'+(ph===1?'':'s')+(PQ.running?'…':' waiting to upload'));
  if(o)parts.push(o+' change'+(o===1?'':'s')+' waiting to send');
  if(!parts.length){netPill(!!NET.boot,NET.boot);return;}
  netPill(true,((navigator.onLine===false||NET.off)?'No signal · ':'')+parts.join(' · '));
}
function enqueue(m,a){var o=outbox();o.push({m:m,a:a,t:Date.now()});outboxSet(o);netStatus();setTimeout(flush,50);}
var FL=null,RT=null;
function retryLater(){if(RT)return;RT=setTimeout(function(){RT=null;flush();pumpPhotos();},20000);}
function flush(){
  if(FL)return FL;
  if(!S.pass||!outbox().length){netStatus();return Promise.resolve();}
  var sent=0;
  FL=(function step(){var o=outbox();if(!o.length)return Promise.resolve();var it=o[0];
    return rawCall(it.m,it.a).then(function(){sent++;var o2=outbox();o2.shift();outboxSet(o2);netStatus();return step();},
      function(e){if(e.net)throw e;var o2=outbox();o2.shift();outboxSet(o2);toast('A saved change couldn’t be sent: '+e.message,true);return step();});})()
  .then(function(){FL=null;netStatus();if(sent){toast(sent===1?'Your saved change was sent.':'Your '+sent+' saved changes were sent.');setTimeout(function(){if(S.pass&&S.view!=='login')boot();},300);}},
        function(){FL=null;netStatus();retryLater();});
  return FL;
}
function call(method,args){
  args=args||{};
  if(queueable(method,args)&&(outbox().length||navigator.onLine===false)){var r0=OPT[method](args);if(r0!=null){enqueue(method,args);return Promise.resolve(r0);}}
  var pre=(!RO[method]&&outbox().length)?flush().catch(function(){}):Promise.resolve();
  return pre.then(function(){return rawCall(method,args);}).then(function(d){if(CACHED[method]&&!Object.keys(args).length)cacheSet(method,d);return d;},
    function(e){if(e.net&&queueable(method,args)){var r1=OPT[method](args);if(r1!=null){enqueue(method,args);return r1;}}throw e;});
}
/* photos wait on the phone (IndexedDB) and upload in the background, one at a time, retrying on their own */
var PQ={items:[],running:false,db:null,loaded:false};
function pqDb(){return new Promise(function(res){if(PQ.db)return res(PQ.db);if(!window.indexedDB)return res(null);
  try{var rq=indexedDB.open('teamforte',1);rq.onupgradeneeded=function(){rq.result.createObjectStore('photos',{keyPath:'cid'});};rq.onsuccess=function(){PQ.db=rq.result;res(PQ.db);};rq.onerror=function(){res(null);};}catch(e){res(null);}});}
function pqTx(mode,fn){return pqDb().then(function(db){if(!db)return null;return new Promise(function(res){
  try{var tx=db.transaction('photos',mode),rq=fn(tx.objectStore('photos'));tx.oncomplete=function(){res(rq&&rq.result!==undefined?rq.result:null);};tx.onerror=tx.onabort=function(){res(null);};}catch(e){res(null);}});});}
function pqLoad(){return pqTx('readonly',function(st){return st.getAll();}).then(function(all){if(all&&all.length){var have={};PQ.items.forEach(function(x){have[x.cid]=1;});all.forEach(function(x){if(!have[x.cid])PQ.items.push(x);});PQ.items.sort(function(a,b){return a.t-b.t;});}PQ.inject();netStatus();});}
PQ.recent=[];
PQ.inject=function(){var now=Date.now();PQ.recent=PQ.recent.filter(function(r){return now-r.t<180000;});
  PQ.recent.forEach(function(r){var j=findJob(r.jobId);if(j&&!(j.photos||[]).some(function(p){return p.id===r.p.id;})){j.photos=j.photos||[];j.photos.push(r.p);}});
  PQ.items.forEach(function(it){var j=findJob(it.jobId);if(!j)return;j.photos=j.photos||[];var tid='q_'+it.cid;S.prev[tid]=it.thumb;
  if(!j.photos.some(function(p){return p.id===tid;}))j.photos.push({id:tid,stage:it.stage,caption:'',w:it.width,h:it.height,pending:true});});};
function pqAdd(it){PQ.items.push(it);return pqTx('readwrite',function(st){return st.put(it);});}
function pqDel(cid){PQ.items=PQ.items.filter(function(x){return x.cid!==cid;});return pqTx('readwrite',function(st){return st.delete(cid);});}
function pumpPhotos(){
  if(PQ.running||!PQ.items.length||!S.pass||S.view==='login')return;
  PQ.running=true;netStatus();var done=0;
  (function next(){var it=PQ.items[0];
    if(!it){PQ.running=false;netStatus();if(done)toast(done+' photo'+(done===1?'':'s')+' uploaded.');return;}
    rawCall('uploadPhoto',{jobId:it.jobId,stage:it.stage,base64:it.base64,mime:'image/jpeg',width:it.width,height:it.height,cid:it.cid}).then(function(p){
      done++;var tid='q_'+it.cid;S.prev[p.id]=it.thumb;
      S.jobs.forEach(function(j){(j.photos||[]).forEach(function(x){if(x.id===tid){x.id=p.id;x.stage=p.stage||x.stage;delete x.pending;PQ.recent.push({jobId:j.id,p:x,t:Date.now()});}});});
      return pqDel(it.cid).then(function(){netStatus();if(S.view==='job'&&!isTyping())whenIdle(renderKeepScroll);next();});
    },function(e){
      if(e.net){PQ.running=false;netStatus();retryLater();return;}
      var tid='q_'+it.cid;S.jobs.forEach(function(j){j.photos=(j.photos||[]).filter(function(x){return x.id!==tid;});});
      pqDel(it.cid).then(function(){toast('A photo couldn’t upload: '+e.message,true);if(S.view==='job')whenIdle(renderKeepScroll);next();});
    });})();
}
window.addEventListener('online',function(){NET.off=false;netStatus();flush();pumpPhotos();});
window.addEventListener('offline',function(){netStatus();});

var toastT;
function toast(msg,err){
  var old=document.querySelector('.toast');if(old)old.remove();
  var t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;document.body.appendChild(t);
  clearTimeout(toastT);toastT=setTimeout(function(){t.remove();},err?4500:2200);
}

function render(){
  document.body.classList.remove('has-tabs');
  if(S.view==='login')return renderLogin();
  if(S.view==='loading'){app.innerHTML=bar('<div class="brand">TEAM <b>FORTE</b></div>')+'<div class="loading"><div class="spin dk"></div></div>';return;}
  if(S.tab!=='photos'){MAT.render();drawTabs();return;}
  if(S.view==='job'&&job()){renderJob();drawTabs();return;}
  if(S.view==='job'&&S.jobWait){app.innerHTML=bar('<div class="brand">TEAM <b>FORTE</b></div>')+'<div class="loading"><div class="spin dk"></div></div>';drawTabs();return;}
  S.view='home';renderHome();drawTabs();
}

function bar(inner){return '<div class="bar"><div class="wrap">'+inner+'</div></div>';}

function renderLogin(msg){
  app.innerHTML='<div class="login"><div class="box">'+
    '<div class="logo">TEAM <b>FORTE</b></div><p>Quotes, materials &amp; website photos</p>'+
    '<form id="lf"><input class="in" id="pc" type="password" inputmode="text" autocomplete="current-password" placeholder="Passcode" aria-label="Passcode" required>'+
    '<label class="remember"><input type="checkbox" id="rm" checked> Keep me logged in on this phone</label>'+
    '<button class="btn block" id="lb" type="submit">Log in</button><div class="err" id="le">'+esc(msg||'')+'</div></form></div></div>';
  var f=document.getElementById('lf');

function logout(msg){S.pass='';store('tfp_pass',null);cacheClear();S.view='login';MAT.reset();render();if(msg){var le=document.getElementById('le');if(le)le.textContent=msg;}}

function isCrew(){return S.user&&S.user.role==='crew';}
function applyBoot(d){
  S.user=(d.ping&&d.ping.user)||{name:'Owner',role:'owner'};
  var ok=isCrew()?['jobs','photos']:['quotes','photos','money'];
  if(ok.indexOf(S.tab)<0)S.tab=ok[0];
  var l=d.list||{};S.jobs=l.jobs||[];if(l.url)EXEC_URL=l.url;sortJobs();
  if(d.mat)MAT.apply(d.mat);
  if(d.crew)MAT.applyCrew(d.crew);
  reapplyQueued();
}
function typing(){var a=document.activeElement;return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='checkbox'&&a.type!=='radio');}
function boot(){
  var cached=cacheGet('boot');
  if(!PQ.loaded){PQ.loaded=true;pqLoad().then(function(){if(S.view!=='login'){if(S.view==='job'&&!typing())render();pumpPhotos();}});}
  if(cached){applyBoot(cached);if(S.view==='login'||S.view==='loading')S.view='home';render();NET.boot='Updating…';netStatus();}
  else{S.view='loading';render();}
  return call('boot',{ver:(cached&&cached.ver)||''}).then(function(d){
    NET.boot='';
    if(d&&d.same){netStatus();flush();pumpPhotos();return;}
    cacheSet('boot',d);
    var same=cached&&JSON.stringify(cached)===JSON.stringify(d);
    applyBoot(d);
    if(S.view==='loading'||S.view==='login')S.view='home';
    if(!same)whenIdle(function(){if(!typing()&&!document.querySelector('.sheet,.modal,dialog[open]'))render();});
    netStatus();flush();pumpPhotos();
  }).catch(function(e){
    NET.boot='';
    if(S.view==='login')return;
    if(cached&&e.net){NET.boot='No signal — showing saved info';netStatus();setTimeout(function(){NET.boot='';netStatus();},4000);retryLater();return;}
    netStatus();
    if(cached){toast(e.message,true);return;}
    S.view='home';render();toast(e.message,true);
  });
}
window.addEventListener('online',function(){if(S.pass&&S.view!=='login')boot();});
window.TFNET={call:call,outbox:outbox,flush:flush,PQ:PQ,findJob:findJob,upload:upload,pump:pumpPhotos};

});

function sheet(html,onClose){
  closeSheet();
  var ov=document.createElement('div');ov.className='ov';ov.id='ov';
  ov.innerHTML='<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+html+'</div>';
  ov.addEventListener('click',function(e){
    if(e.target===ov&&sheetDirty(ov)){if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();toast('Tap ✕ to close without saving');return;}
    if(e.target===ov||e.target.closest('[data-close]')){closeSheet();if(onClose)onClose();}});
  document.body.appendChild(ov);document.body.style.overflow='hidden';
  return ov;
}
function sheetDirty(ov){return Array.prototype.some.call(ov.querySelectorAll('input,textarea'),function(i){
  if(i.type==='checkbox'||i.type==='radio')return i.checked!==i.defaultChecked;if(i.type==='file'||i.type==='search')return false;return i.value!==i.defaultValue;});}
function closeSheet(){var o=document.getElementById('ov');if(o)o.remove();document.body.style.overflow='';}
function closeBtn(){return '<button class="x" data-close aria-label="Close">'+ICON.x+'</button>';}

function isConflict(x){return /^CONFLICT/.test((x&&x.message)||'');}

}

function photoSheet(id){

    '</div><p class="hint">The cover photo is the one shown on the website card for this job.</p>');
  function after(r,msg){var k=j.photos.indexOf(p);if(r&&k>=0)j.photos[k]=Object.assign(p,{stage:r.stage||p.stage,caption:r.caption!=null?r.caption:p.caption});resort(j);render();if(msg)toast(msg);}

  };
  ov.querySelector('#capb').onclick=function(){var v=ov.querySelector('#cap').value;
    call('updatePhoto',{id:p.id,caption:v}).then(function(r){closeSheet();after(r,'Caption saved');}).catch(function(e2){toast(e2.message,true);});
  };
  function mv(dir){call('movePhoto',{id:p.id,dir:dir}).then(function(){
      var g=photosOf(j,p.stage);var i=g.indexOf(p),k=i+dir;if(k<0||k>=g.length)return;
      var a=j.photos.indexOf(g[i]),b2=j.photos.indexOf(g[k]);var t=j.photos[a];j.photos[a]=j.photos[b2];j.photos[b2]=t;

  };
  if(ov.querySelector('#del'))ov.querySelector('#del').onclick=function(){

      if(!ok){photoSheet(p.id);return;}
      call('deletePhoto',{id:p.id}).then(function(){j.photos=j.photos.filter(function(x){return x.id!==p.id;});if(j.coverId===p.id)j.coverId='';render();toast('Photo deleted');})
        .catch(function(e2){toast(e2.message,true);});
    });

function resort(j){
  var rank={before:0,during:1,after:2};
  j.photos.forEach(function(p,i){p._i=p._o?1e9+p._o:i;});
  j.photos.sort(function(a,b){return (rank[a.stage]-rank[b.stage])||(a._i-b._i);});
  j.photos.forEach(function(p){delete p._i;delete p._o;});
}

/* ---------- uploads ---------- */
function shrink(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file);var im=new Image();
    im.onload=function(){
      try{
        var w=im.naturalWidth,h=im.naturalHeight,max=1600,s=Math.min(1,max/Math.max(w,h));
        var cw=Math.round(w*s),ch=Math.round(h*s);
        var cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
        var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cw,ch);cx.drawImage(im,0,0,cw,ch);
        var full=cv.toDataURL('image/jpeg',0.78);
        var ts=Math.min(1,500/Math.max(cw,ch));var tv=document.createElement('canvas');tv.width=Math.round(cw*ts);tv.height=Math.round(ch*ts);
        tv.getContext('2d').drawImage(cv,0,0,tv.width,tv.height);
        URL.revokeObjectURL(url);
        res({base64:full.split(',')[1],width:cw,height:ch,thumb:tv.toDataURL('image/jpeg',0.8)});
      }catch(e){URL.revokeObjectURL(url);rej(e);}
    };
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('Couldn’t read '+(file.name||'that photo')+'. Try a JPG.'));};
    im.src=url;
  });
}

function upload(files,stage){
  var j=job();if(!j||!files.length)return;
  var list=Array.prototype.slice.call(files,0,30);
  S.upload={total:list.length,done:0,failed:0};drawProg();
  var errs=[],added=0,seq=Promise.resolve();
  list.forEach(function(file){
    seq=seq.then(function(){
      return shrink(file).then(function(sh){
        var it={cid:Date.now().toString(36)+Math.random().toString(36).slice(2,8),jobId:j.id,stage:stage,base64:sh.base64,width:sh.width,height:sh.height,thumb:sh.thumb,t:Date.now()};
        return pqAdd(it).then(function(){added++;PQ.inject();});
      }).catch(function(e){S.upload.failed++;errs.push(e.message);})
      .then(function(){S.upload.done++;drawProg();if(S.view==='job'&&!isTyping())whenIdle(renderKeepScroll);});
    });
  });
  seq.then(function(){
    S.upload=null;drawProg();netStatus();
    if(errs.length)toast(errs.length+' of '+list.length+' couldn’t be read: '+errs[0],true);
    else toast(added+' photo'+(added===1?'':'s')+' added. '+(navigator.onLine===false?'They’ll upload when you have signal.':'Uploading in the background.'));
    pumpPhotos();
  });
}

var DRV={thumbs:{},sel:[],data:null,cur:null,stage:'before',jobId:''};
function driveSheet(stage){
  var j=job();if(!j)return;
  DRV.stage=stage;DRV.sel=[];DRV.jobId=j.id;DRV.data=null;
  var ov=sheet('<h3>Photos from Google Drive'+closeBtn()+'</h3>'+
    '<div class="dv-tabs"><button data-dv="folder" class="on">My Drive</button><button data-dv="shared">Shared with me</button><button data-dv="recent">Recent</button></div>'+
    '<form class="dv-search" id="dvs"><input class="in" id="dvq" type="search" placeholder="Search Drive (folder or file name)" enterkeyhint="search" autocomplete="off" autocapitalize="off"></form>'+
    '<div id="dvb"></div>'+
    '<div class="dv-foot"><div class="dv-st">'+STAGES.map(function(s){return '<button type="button" data-dvst="'+s[0]+'"'+(s[0]===stage?' class="on"':'')+'>'+s[1]+'</button>';}).join('')+'</div>'+

  function tabsOn(m){ov.querySelectorAll('[data-dv]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-dv')===m);});}
  ov.addEventListener('click',function(e){
    var b=e.target.closest('[data-dv]');if(b){var m=b.getAttribute('data-dv');tabsOn(m);driveGo(m==='folder'?{mode:'folder',folder:'root'}:{mode:m});return;}
    b=e.target.closest('[data-dvf]');if(b){tabsOn('folder');driveGo({mode:'folder',folder:b.getAttribute('data-dvf')});return;}
    b=e.target.closest('[data-dvp]');if(b){var id=b.getAttribute('data-dvp'),k=DRV.sel.indexOf(id);if(k>=0)DRV.sel.splice(k,1);else DRV.sel.push(id);b.classList.toggle('on',k<0);driveFoot();return;}
    b=e.target.closest('[data-dvall]');if(b){var ids=(DRV.data&&DRV.data.files||[]).map(function(f){return f.id;});var all=ids.every(function(i){return DRV.sel.indexOf(i)>=0;});
      ids.forEach(function(i){var k2=DRV.sel.indexOf(i);if(all&&k2>=0)DRV.sel.splice(k2,1);if(!all&&k2<0)DRV.sel.push(i);});driveDraw();return;}
    b=e.target.closest('[data-dvmore]');if(b){driveGo({token:DRV.data.token},true);return;}
    b=e.target.closest('[data-dvst]');if(b){DRV.stage=b.getAttribute('data-dvst');ov.querySelectorAll('[data-dvst]').forEach(function(z){z.classList.toggle('on',z===b);});driveFoot();return;}
    if(e.target.closest('#dvgo'))driveImport();
  });
  driveGo({mode:'folder',folder:'root'});

function driveGo(args,more){
  var body=document.getElementById('dvb');if(!body)return;
  if(!more){DRV.cur=args;body.innerHTML='<div class="loading" style="padding:40px 0"><div class="spin dk"></div></div>';}
  else{var mb=body.querySelector('[data-dvmore]');if(mb){mb.disabled=true;mb.textContent='Loading…';}}
  var me=DRV.cur;
  call('driveBrowse',args).then(function(d){
    if(DRV.cur!==me||!document.getElementById('dvb'))return;
    (d.files||[]).forEach(function(f){if(f.thumb&&DRV.thumbs[f.id]===undefined)DRV.thumbs[f.id]=f.thumb;});
    if(more&&DRV.data){DRV.data.files=DRV.data.files.concat(d.files);DRV.data.token=d.token;}else DRV.data=d;
    driveDraw();
  }).catch(function(e){var b2=document.getElementById('dvb');if(b2&&DRV.cur===me)b2.innerHTML='<div class="dv-empty">'+esc(e.message)+'</div>';});
}
function driveDraw(){
  var body=document.getElementById('dvb'),d=DRV.data;if(!body||!d)return;
  var h='';
  if(d.mode==='folder'&&d.path.length)h+='<div class="dv-path">'+d.path.map(function(p,i){return (i?'<i>›</i>':'')+'<button type="button" data-dvf="'+esc(p.id)+'">'+esc(p.name)+'</button>';}).join('')+'</div>';
  if(d.mode==='search')h+='<div class="dv-path">Results for “'+esc(DRV.cur.q||'')+'”</div>';
  if(d.mode==='recent')h+='<div class="dv-path">Photos changed in the last 45 days</div>';
  if(d.folders.length)h+='<div class="dv-fl">'+d.folders.map(function(f){return '<button type="button" class="dv-f" data-dvf="'+esc(f.id)+'">'+ICON.folder+'<span>'+esc(f.name)+'</span></button>';}).join('')+'</div>';
  if(d.files.length){
    var all=d.files.every(function(f){return DRV.sel.indexOf(f.id)>=0;});
    h+='<div class="dv-bar"><span>'+d.files.length+(d.token?'+':'')+' photo'+(d.files.length===1?'':'s')+'</span><button type="button" data-dvall>'+(all?'Clear all':'Select all')+'</button></div>';
    h+='<div class="dv-g">'+d.files.map(function(f){var t=DRV.thumbs[f.id];
      return '<button type="button" class="dv-p'+(DRV.sel.indexOf(f.id)>=0?' on':'')+'" data-dvp="'+esc(f.id)+'" aria-label="'+esc(f.name)+'">'+(t?'<img src="'+esc(t)+'" alt="" loading="lazy" decoding="async">':'')+'<span class="nm">'+esc(f.name)+'</span><span class="ck"></span></button>';}).join('')+'</div>';
    if(d.token)h+='<button type="button" class="btn ghost dv-more" data-dvmore>Show more photos</button>';
  }
  if(!d.folders.length&&!d.files.length)h+='<div class="dv-empty">'+(d.mode==='search'?'Nothing found. Try another word.':'No folders or photos here.')+'</div>';
  body.innerHTML=h;
  Array.prototype.forEach.call(body.querySelectorAll('.dv-p img'),function(im){im.onerror=function(){driveThumbFail(im);};});
  driveFoot();driveThumbs();

  function addDays(n){var d=new Date();var added=0;while(added<n){d.setDate(d.getDate()+1);if(d.getDay()!==0&&d.getDay()!==6)added++;}return d.toISOString().slice(0,10);}
  function mergeQ(r){for(var i=0;i<M.quotes.length;i++)if(M.quotes[i].id===r.id){M.quotes[i]=r;return r;}M.quotes.unshift(r);return r;}
  function fresh(qq){

  /* ----- roof measurements without approving + tap-to-measure on the satellite photo ----- */
  var MT_TYPES=[['ridge','Ridge','#FF5440'],['hip','Hip','#FFB020'],['valley','Valley','#3DA5FF'],['eave','Eave','#35C46A'],['rake','Rake','#C77DFF']];
  var MT_KEY={ridge:'ridges',hip:'hips',valley:'valleys',eave:'eaves',rake:'rakes'};
  function mtColor(t){for(var i=0;i<MT_TYPES.length;i++)if(MT_TYPES[i][0]===t)return MT_TYPES[i][2];return '#fff';}
  function mtLabel(t){for(var i=0;i<MT_TYPES.length;i++)if(MT_TYPES[i][0]===t)return MT_TYPES[i][1];return t;}
  function mtRise(p){return TAKEOFF.pitchRise(p)||0;}
  /* Ridges and eaves are level, so the photo length is the real length. Hips and valleys run diagonally down the slope; rakes run straight down it. */
  function mtTrue(t,plan,pitch){var r=mtRise(pitch)/12;if(t==='hip'||t==='valley')return plan*Math.sqrt(1+r*r/2);if(t==='rake')return plan*Math.sqrt(1+r*r);return plan;}
  function mtFeet(pts){var ft=0,R=20902231,rad=Math.PI/180;
    for(var i=1;i<pts.length;i++){var a=pts[i-1],b=pts[i],dLat=(b[0]-a[0])*rad,dLng=(b[1]-a[1])*rad;
      var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a[0]*rad)*Math.cos(b[0]*rad)*Math.sin(dLng/2)*Math.sin(dLng/2);
      ft+=2*R*Math.asin(Math.min(1,Math.sqrt(h)));}
    return ft;}
  function mtTotals(lines){var t={};(lines||[]).forEach(function(l){t[l.t]=(t[l.t]||0)+(Number(l.len)||0);});return t;}
  function applyTraced(m,lines){
    var t=mtTotals(lines);m.est=Object.assign({},m.est||{});
    Object.keys(MT_KEY).forEach(function(k){if(t[k]>0){m[MT_KEY[k]]=Math.round(t[k]);delete m.est[MT_KEY[k]];}});
    m.traced=lines||[];return m;}
  function emptyMeas(){return {area:0,eaves:0,rakes:0,ridges:0,hips:0,valleys:0,pitch:'',roofs:[],est:{}};}
  /* Measurements for a quote: saved numbers once approved, otherwise the estimate from the roof outline, with any lines measured on the photo on top */
  function measFor(x){
    var saved=x.meas||{},m;
    if(x.status!=='new'&&saved.area)m=JSON.parse(JSON.stringify(saved));
    else m=(x.roofs&&x.roofs.length)?TAKEOFF.estimate(x.roofs):emptyMeas();
    if(!m.pitch&&saved.pitch)m.pitch=saved.pitch;
    return applyTraced(m,saved.traced||[]);
  }
  function capBundles(m){var lf=(Number(m.ridges)||0)+(Number(m.hips)||0);return {lf:Math.round(lf),bundles:Math.ceil(lf*1.05/33)};}
  function measCard(x){
    var m=measFor(x),est=m.est||{},tr=m.traced||[],hasRoof=!!m.area;
    function tag(k){return est[k]?'<i class="mtag">est.</i>':(m[k]&&tr.some(function(l){return MT_KEY[l.t]===k;})?'<i class="mtag ok">measured</i>':'');}
    function row(k,label){if(!hasRoof&&!m[k])return '';return kv(label+tag(k),m[k]?Math.round(m[k]).toLocaleString()+' ft':'—');}
    var cap=capBundles(m);
    var h='<div class="card"><h2>Roof measurements <small>no approval needed</small></h2>';
    if(hasRoof){
      h+=kv('Roof area',Math.round(m.area).toLocaleString()+' sq ft · '+(Math.round(m.area/10)/10)+' squares');
      (m.roofs||[]).length>1&&(m.roofs||[]).forEach(function(r){h+=kv('&nbsp;&nbsp;'+esc(r.name),Math.round(r.sqft).toLocaleString()+' sq ft · '+esc(r.pitch||'pitch ?'));});
      h+=kv('Main pitch',esc(m.pitch||'?'));
    }
    h+=row('ridges','Ridges')+row('hips','Hips')+row('valleys','Valleys')+row('eaves','Eaves')+row('rakes','Rakes');
    if(cap.lf)h+=kv('Hip &amp; ridge cap','<span class="money">'+cap.bundles+' bundle'+(cap.bundles===1?'':'s')+'</span> <span class="hint">('+cap.lf+' LF + 5%, 33 LF each)</span>');
    if(['ridges','hips','valleys','eaves','rakes'].some(function(k){return est[k]&&m[k];}))
      h+='<p class="hint"><b>est.</b> = rough guess from the roof outline, not measured. For a repair, measure it on the satellite photo.</p>';
    if(!hasRoof&&!tr.length)h+='<p class="hint">Measure the ridges, hips or other lines you need on the satellite photo.</p>';
    h+='<button class="btn dark block mt" data-m="measuretool">'+(tr.length?'Edit measured lines ('+tr.length+')':'Measure on satellite photo')+'</button>';
    if(!canMeasureHere())h+='<p class="hint">Needs the Google Maps key (Quotes › Quote prices).</p>';
    return h+'</div>';
  }
  function measureTool(){
    var x=q();
    if(!canMeasureHere()){toast('Add the Google Maps key under Quote prices first.',true);return;}
    var base=measFor(x);
    var st={type:'ridge',pitch:base.pitch||'6/12',lines:JSON.parse(JSON.stringify((x.meas&&x.meas.traced)||[])),cur:[],dirty:false,map:null,objs:[],curObjs:[]};
    var pitches=[];for(var p=0;p<=18;p++)pitches.push(p+'/12');
    if(pitches.indexOf(st.pitch)<0)pitches.push(st.pitch);
    var ov=document.createElement('div');ov.className='mz';ov.id='mz';
    ov.innerHTML='<div class="mz-top"><button type="button" class="mz-btn" data-z="close" aria-label="Close">'+ICON.x+'</button><b>Measure roof</b><button type="button" class="mz-btn mz-save" data-z="save">Save</button></div>'+
      '<div class="mz-map" id="mzmap"><div class="mz-load">Loading satellite photo…</div></div>'+
      '<div class="mz-panel"><div class="mz-types" id="mztypes">'+MT_TYPES.map(function(t){return '<button type="button" data-zt="'+t[0]+'"><i style="background:'+t[2]+'"></i>'+t[1]+'</button>';}).join('')+'</div>'+
      '<div class="mz-read" id="mzread"></div>'+
      '<div class="mz-acts"><button type="button" class="btn ghost" data-z="undo">Undo point</button><button type="button" class="btn" data-z="finish">Finish line</button></div>'+
      '<label class="mz-pitch">Pitch <select id="mzpitch">'+pitches.map(function(v){return '<option'+(v===st.pitch?' selected':'')+'>'+esc(v)+'</option>';}).join('')+'</select><span>used for hips, valleys and rakes</span></label>'+
      '<div id="mzlist"></div></div>';
    document.body.appendChild(ov);document.body.style.overflow='hidden';
    function g(id){return ov.querySelector('#'+id);}
    function clearObjs(a){a.forEach(function(o){o.setMap(null);});a.length=0;}
    function ll(p){return {lat:p[0],lng:p[1]};}
    function label(map,pos,text,color){return new google.maps.Marker({map:map,position:pos,clickable:false,icon:{path:google.maps.SymbolPath.CIRCLE,scale:0},label:{text:text,color:'#fff',fontSize:'12px',fontWeight:'800',className:'mz-lbl'}});}
    function drawLines(){
      if(!st.map)return;clearObjs(st.objs);
      st.lines.forEach(function(l,i){
        var c=mtColor(l.t);
        st.objs.push(new google.maps.Polyline({map:st.map,path:l.pts.map(ll),strokeColor:c,strokeWeight:4,strokeOpacity:.95,clickable:false}));
        var mid=l.pts[Math.floor((l.pts.length-1)/2)],nxt=l.pts[Math.floor((l.pts.length-1)/2)+1]||mid;
        st.objs.push(label(st.map,{lat:(mid[0]+nxt[0])/2,lng:(mid[1]+nxt[1])/2},Math.round(l.len)+' ft',c));
      });
    }
    function drawCur(){
      if(!st.map)return;clearObjs(st.curObjs);
      var c=mtColor(st.type);
      if(st.cur.length>1)st.curObjs.push(new google.maps.Polyline({map:st.map,path:st.cur.map(ll),strokeColor:c,strokeWeight:3,strokeOpacity:0,clickable:false,
        icons:[{icon:{path:'M 0,-1 0,1',strokeOpacity:1,strokeColor:c,scale:3},offset:'0',repeat:'12px'}]}));
      st.cur.forEach(function(p,i){
        var mk=new google.maps.Marker({map:st.map,position:ll(p),draggable:true,icon:{path:google.maps.SymbolPath.CIRCLE,scale:7,fillColor:'#fff',fillOpacity:1,strokeColor:c,strokeWeight:3}});
        mk.addListener('drag',function(e){st.cur[i]=[e.latLng.lat(),e.latLng.lng()];readout();});
        mk.addListener('dragend',function(){drawCur();});
        st.curObjs.push(mk);
      });
    }
    function readout(){
      var plan=mtFeet(st.cur),len=mtTrue(st.type,plan,st.pitch);
      g('mzread').innerHTML=st.cur.length?'<b>'+mtLabel(st.type)+':</b> '+st.cur.length+' point'+(st.cur.length===1?'':'s')+(st.cur.length>1?' · <b>'+Math.round(len*10)/10+' ft</b>'+(Math.abs(len-plan)>.05?' <span>('+Math.round(plan*10)/10+' ft on the photo)</span>':''):' · tap the other end'):
        'Pick a type, then tap each end of the line on the photo. Tap more points to follow a bend. Drag a point to fine-tune it.';
      Array.prototype.forEach.call(g('mztypes').children,function(b){b.classList.toggle('on',b.getAttribute('data-zt')===st.type);});
    }
    function list(){
      var t=mtTotals(st.lines),m=applyTraced(JSON.parse(JSON.stringify(base)),st.lines),cap=capBundles(m);
      var h=st.lines.length?'<div class="mz-ls">'+st.lines.map(function(l,i){return '<div class="mz-li"><i style="background:'+mtColor(l.t)+'"></i><span>'+mtLabel(l.t)+'</span><b>'+Math.round(l.len*10)/10+' ft</b><button type="button" data-zd="'+i+'" aria-label="Delete line">'+ICON.x+'</button></div>';}).join('')+'</div>':'';
      var tot=MT_TYPES.filter(function(k){return t[k[0]];}).map(function(k){return k[1]+'s '+Math.round(t[k[0]])+' ft';}).join(' · ');
      if(tot)h+='<p class="mz-tot">'+tot+'</p>';
      if(cap.lf)h+='<p class="mz-tot"><b>Hip &amp; ridge cap: '+cap.bundles+' bundle'+(cap.bundles===1?'':'s')+'</b> ('+cap.lf+' LF + 5%)'+(function(){var e=m.est||{},w=[];if(e.ridges&&m.ridges)w.push('ridges');if(e.hips&&m.hips)w.push('hips');return w.length?' · '+w.join(' &amp; ')+' still estimated':'';})()+'</p>';
      g('mzlist').innerHTML=h;
    }
    function refresh(){readout();list();drawCur();drawLines();}
    function finish(){
      if(st.cur.length<2){toast('Tap both ends of the line first.',true);return false;}
      var plan=mtFeet(st.cur);
      st.lines.push({t:st.type,pts:st.cur.map(function(p){return [Math.round(p[0]*1e7)/1e7,Math.round(p[1]*1e7)/1e7];}),plan:Math.round(plan*10)/10,len:Math.round(mtTrue(st.type,plan,st.pitch)*10)/10,pitch:st.pitch});
      st.cur=[];st.dirty=true;refresh();return true;
    }
    function close(){ov.remove();document.body.style.overflow='';}
    function save(){
      if(st.cur.length>1)finish();
      var x2=q(),saved=x2.meas||{},m,args;
      if(x2.status!=='new'&&x2.type!=='repair'&&saved.area){
        m=applyTraced(JSON.parse(JSON.stringify(saved)),st.lines);
        args={meas:m,lines:TAKEOFF.lines(m,x2.pick,priceMap(),x2.lines)};
      }else{
        m=applyTraced(measFor(Object.assign({},x2,{meas:{}})),st.lines);
        if(!m.pitch)m.pitch=st.pitch;
        args={meas:m};
      }
      var b=ov.querySelector('[data-z=save]');b.disabled=true;b.textContent='Saving…';
      saveQ(args,args.lines?'Saved. Materials list updated.':'Measurements saved').then(close).catch(function(){b.disabled=false;b.textContent='Save';});

      '<button class="btn dark block mt" data-m="recalc">Update materials list</button>'+
      '<button class="btn ghost block mt" data-m="measuretool">'+((m.traced||[]).length?'Edit measured lines ('+m.traced.length+')':'Measure on satellite photo')+'</button></div>';

    h+='<div class="card"><h2>Materials <small>'+ls.length+' items</small></h2><div id="lines">';

    });
    h+='</div><button class="btn ghost block mt" data-m="addline">'+ICON.plus+'Add item</button>'+
      '<div class="tot">'+kv('Subtotal','<span class="money">'+money(t.subtotal)+'</span>')+kv('Sales tax ('+(M.settings.taxRate||0)+'%)','<span class="money">'+money(t.tax)+'</span>')+
      '<div class="kv grand"><span>Total</span><b class="money">'+money(t.total)+'</b></div></div>'+
      (M.prices.some(function(p){return p.source==='starter';})?'<div class="note">Some prices are starter estimates. Update them under Spending › Prices, or connect ABC Supply for your account prices.</div>':'')+

      '<button class="btn block mt" data-m="order" data-v="abc"'+(M.settings.abc&&M.settings.abc.connected?'':' disabled')+'>Order from ABC Supply</button>'+
      (M.settings.abc&&M.settings.abc.connected?'':'<p class="hint" style="text-align:center">Connect ABC Supply in Spending › Settings to order here.</p>')+

  function wireQuote(x){
    var pk=document.getElementById('pkg');
    if(pk)pk.onclick=function(e){var b=e.target.closest('[data-pk]');if(!b)return;var i=+b.getAttribute('data-pk');
      var priceEl=document.getElementById('qp');var cur=Number(priceEl.value)||0;var old=M.draft&&M.draft.id===x.id?M.draft.pick:(x.pick>=0?x.pick:1);
      M.draft={id:x.id,pick:i,price:(!cur||cur===mid(x,old))?mid(x,i):cur};
      var c=document.getElementById('qc').value;x.color=c;render();};
  }

  function readMeas(x){
    var m=Object.assign({},x.meas||{});var est=Object.assign({},m.est||{});
    document.querySelectorAll('[data-meas]').forEach(function(el){
      var key=el.getAttribute('data-meas');
      if(key==='pitch'){m.pitch=el.value.trim();return;}
      var v=Number(String(el.value).replace(/[^\d.]/g,''))||0;
      if(m[key]!==v)delete est[key];
      m[key]=v;
    });
    m.est=est;return m;
  }

  /* base = the values this phone loaded for each field it changes; the server refuses the save if someone else changed them since */
  function baseOf(x,args){var b={};if(!x)return b;Object.keys(args).forEach(function(k){if(k!=='id'&&k!=='base'&&k!=='send')b[k]=x[k]===undefined?null:x[k];});return b;}
  function saveQ(args,msg){
    args.id=M.qid;if(!args.base)args.base=baseOf(q(),args);
    return call('saveQuote',args).then(function(r){mergeQ(r);render();if(msg)toast(msg);return r;}).catch(function(e){if(isConflict(e))conflictBox(e,function(){load().then(render).then(function(){toast('Reloaded');}).catch(err);});else err(e);throw e;});
  }

  function approve(){
    var x=q();var pick=M.draft&&M.draft.id===x.id?M.draft.pick:(x.pick>=0?x.pick:1);
    var price=Number(String(document.getElementById('qp').value).replace(/[^\d.]/g,''))||0;
    var color=document.getElementById('qc').value.trim();
    var m=measFor(x);
    m.waste=M.settings.waste!=null?M.settings.waste:m.waste;m.iceCourses=M.settings.iceCourses!=null?M.settings.iceCourses:m.iceCourses;
    var ls=TAKEOFF.lines(m,pick,priceMap(),[]);
    var b=document.querySelector('[data-m=approve]');if(b){b.disabled=true;b.textContent='Approving…';}
    saveQ({status:'approved',pick:pick,color:color,contractPrice:price,meas:m,lines:ls}).then(function(r){
      M.draft=null;M.qfilter='approved';toast('Approved. Materials list is ready.');
      call('list').then(function(d){S.jobs=d.jobs||[];cacheMerge('list',d);}).catch(function(){});
      return r;
    }).catch(function(){if(b){b.disabled=false;b.textContent='Approve job & build materials list';}});
  }

  function recalc(){
    var x=q();var m=readMeas(x);
    var ls=TAKEOFF.lines(m,x.pick,priceMap(),x.lines);
    saveQ({meas:m,lines:ls},'Materials list updated');

      }).catch(function(e){r.innerHTML='';err(e);});

    var r=ov.querySelector('#lr');if(r)r.onclick=function(){var nl=fresh(x);nl[i].manual=false;nl[i].priceManual=false;nl[i].itemManual=false;nl[i].qty=nl[i].calc;

  var swatchCache={};
  function seedRand(str){var h=1779033703^str.length;for(var i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
    return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);var t=(h^=h>>>16)>>>0;return t/4294967296;};}
  function hexRgb(hx){var n=parseInt(hx.slice(1),16);return [n>>16&255,n>>8&255,n&255];}
  /* Draws laminated architectural shingles: 5 courses of random-width tabs, each tab a blend of the color's granules */
  function drawShingles(name,w,h){
    var key=name+'|'+w+'x'+h;if(swatchCache[key])return swatchCache[key];
    var tones=(COLOR_TONES[name]||COLOR_TONES['Estate Gray']).map(hexRgb),rnd=seedRand(name);
    var cv=document.createElement('canvas');cv.width=w;cv.height=h;var ctx=cv.getContext('2d');var im=ctx.createImageData(w,h),d=im.data;
    var rows=5,rh=h/rows,courses=[];
    for(var r=0;r<rows;r++){var x=-Math.round(rnd()*w*0.12),tabs=[];
      while(x<w){var tw=Math.round(w*(0.11+rnd()*0.14));var t=Math.floor(rnd()*(tones.length));if(rnd()<0.12)t=tones.length-1-Math.floor(rnd()*2);
        tabs.push({x0:x,x1:x+tw,tone:t,lean:(rnd()-0.5)*0.12,band:rnd()<0.45?0.25+rnd()*0.3:0,bandTone:Math.floor(rnd()*2),mix:rnd()});x+=tw;}
      courses.push(tabs);}
    for(var y=0;y<h;y++){var r2=Math.min(rows-1,Math.floor(y/rh)),ty=(y-r2*rh)/rh,tabs2=courses[r2];
      for(var xx=0;xx<w;xx++){
        var tab=null,edge=99;
        for(var k=0;k<tabs2.length;k++){var tb=tabs2[k],off=tb.lean*ty*rh,a=tb.x0+off,b=tb.x1+(k+1<tabs2.length?tabs2[k+1].lean*ty*rh:0);
          if(xx>=a&&xx<b){tab=tb;edge=Math.min(xx-a,b-xx);break;}}
        if(!tab)tab=tabs2[tabs2.length-1];
        var base=tones[tab.tone];
        /* lamination shadow band at the top of some tabs */
        if(tab.band&&ty<tab.band)base=tones[tab.bandTone];
        var c0=base;
        /* granule speckle from the other tones */
        var rr=rnd();
        if(rr<0.10)c0=tones[Math.floor(rnd()*tones.length)];
        var n=(rnd()-0.5)*26,shade=1;
        if(ty>0.93)shade=0.45;               /* course shadow line */
        else if(ty<0.06)shade=0.82;          /* overlap shade */
        if(edge<1.2)shade*=0.55;             /* gap between tabs */
        shade*=1-0.10*ty*tab.mix;            /* slight blend down each tab */
        var p=(y*w+xx)*4;
        d[p]=Math.max(0,Math.min(255,(c0[0]+n)*shade));d[p+1]=Math.max(0,Math.min(255,(c0[1]+n)*shade));d[p+2]=Math.max(0,Math.min(255,(c0[2]+n)*shade));d[p+3]=255;
      }}
    ctx.putImageData(im,0,0);
    var url=cv.toDataURL('image/jpeg',0.86);swatchCache[key]=url;return url;
  }

            var info={n:name,s:r.areaSqft,p:row.p,dist:x.distFt,dir:x.dir,est:!!r.noSat,row:row};

            if(x.include){out.roofs.push(row);out.extras.push(info);}else out.nearby.push(info);
          });
          return out;
        }).catch(function(){return out;});
      }).catch(function(er){
        var st=/solar-(\d+)/.exec(String(er&&er.message||''));
        if(st&&st[1]==='404'){out.note='Google has no roof data for this address. Type the roof size below.';return out;}

        if(st){out.note='Couldn’t measure the roof right now ('+st[1]+'). Type the roof size below.';return out;}
        throw er;
      });
    }).catch(function(er){
      if(er&&/API key not valid|API_KEY_INVALID|InvalidKey/i.test(String(er.message||er)))throw new Error('The saved Google key isn’t right. Go to Quote prices and tap “Use my website’s key”.');
      if(er&&er.message==='KEY_BLOCKED')throw new Error('Google turned down the Maps key on the app. Under Quote prices, tap “Use my website’s key”. If it still fails, add teamsforte.github.io/* to that key’s website restrictions in Google Cloud.');

  function roomCalc(list){var t={walls:0,ceil:0,floor:0,trim:0,doors:0,sheets:0,rooms:0};var dw=0;
    (list||[]).forEach(function(r){var l=Number(r.l)||0,w=Number(r.w)||0,h=Number(r.h)||0,d=Number(r.d)||0,wi=Number(r.win)||0;if(!(l>0&&w>0))return;t.rooms++;
      var per=2*(l+w),wall=Math.max(0,per*h-d*DOOR_SF-wi*WIN_SF),area=l*w;
      t.walls+=wall;if(r.c!==false)t.ceil+=area;t.floor+=area;t.trim+=Math.max(0,per-d*DOOR_W);t.doors+=d;dw+=wall+area;});
    t.sheets=dw>0?Math.ceil(dw*1.1/SHEET_SF):0;['walls','ceil','floor','trim'].forEach(function(k){t[k]=Math.round(t[k]);});return t;}

    var mat=mine.length?mine.reduce(function(n,o){return n+orderSpend(o);},0):TAKEOFF.totals(fresh(x),M.settings.taxRate).total;
    var labor=(Number(c.crewDays)||0)*(Number(c.crewRate)||0);var other=(Number(c.dumpster)||0)+(Number(c.permit)||0)+(Number(c.other)||0);
    var rev=jobTotal(x);var profit=rev-mat-labor-other;

  var inspPicker=null;
  function addInspSheet(quoteId){
    var ov=sheet('<h3>Inspection photos'+closeBtn()+'</h3><label class="f">What do they show?</label><select class="in" id="it">'+(M.tags||[]).map(function(t){return '<option>'+esc(t)+'</option>';}).join('')+'</select>'+

      var tag=ov.querySelector('#it').value,note=ov.querySelector('#inote').value;
      inspPicker.onchange=function(){var files=Array.prototype.slice.call(inspPicker.files||[],0,20);inspPicker.value='';if(!files.length)return;closeSheet();uploadInsp(quoteId,files,tag,note);};
      inspPicker.click();

  function uploadInsp(quoteId,files,tag,note){
    S.upload={total:files.length,done:0,failed:0};drawProg();var errs=[];var seq=Promise.resolve();
    files.forEach(function(file){seq=seq.then(function(){return shrink(file).then(function(sh){
      return call('addInspection',{quoteId:quoteId,base64:sh.base64,tag:tag,note:note}).then(function(r){S.prev[r.id]=sh.thumb;(M.inspections=M.inspections||[]).push(r);});
    }).catch(function(e){S.upload.failed++;errs.push(e.message);}).then(function(){S.upload.done++;drawProg();});});});
    seq.then(function(){var u=S.upload;S.upload=null;drawProg();render();toast(u.failed?u.failed+' didn’t upload: '+errs[0]:u.total+' photo'+(u.total===1?'':'s')+' added',!!u.failed);});
  }
  function inspSheet(id){
    var r=(M.inspections||[]).filter(function(z){return z.id===id;})[0];if(!r)return;
    var ov=sheet('<h3>'+esc(r.tag)+closeBtn()+'</h3><img class="big" src="'+esc(img(r.id,1200))+'" alt="">'+
      '<label class="f">Tag</label><select class="in" id="it2">'+(M.tags||[]).map(function(t){return '<option'+(t===r.tag?' selected':'')+'>'+esc(t)+'</option>';}).join('')+'</select>'+
      '<label class="f">Note</label><input class="in" id="in2" maxlength="300" value="'+esc(r.note||'')+'">'+
      '<div class="acts"><button class="btn danger" id="idel">Delete</button><button class="btn" id="isv">Save</button></div>');
    ov.querySelector('#isv').onclick=function(){call('saveInspection',{id:r.id,tag:ov.querySelector('#it2').value,note:ov.querySelector('#in2').value}).then(function(n){Object.assign(r,n);closeSheet();render();toast('Saved');}).catch(err);};
    ov.querySelector('#idel').onclick=function(){call('deleteInspection',{id:r.id}).then(function(){M.inspections=M.inspections.filter(function(z){return z.id!==r.id;});closeSheet();render();toast('Deleted');}).catch(err);};
  }
  function reportSheet(){
    var x=q();
    var ov=sheet('<h3>Inspection report'+closeBtn()+'</h3><p class="sub">Makes a PDF with all '+inspOf(x).length+' photos and notes, saved in Google Drive.</p>'+
      '<label class="f">Email it to <small>(optional)</small></label><input class="in" id="rem" type="email" value="'+esc(x.email||'')+'" placeholder="customer@email.com">'+

  function loadCrew(){return call('crewJobs').then(function(j){applyCrew(j);cacheMerge('crew',j);}).catch(function(e){toast(e.message,true);});}

  function renderCrew(){
    if(!M.crewLoaded&&M.crewFailed){app.innerHTML=bar('<div class="brand">JOBS</div>')+'<div class="wrap"><div class="empty"><b>Couldn\u2019t load jobs</b>Check your signal and try again.<div class="mt"><button class="btn ghost" data-m="crewreload">Try again</button></div></div></div>';return;}
    if(!M.crewLoaded){app.innerHTML=bar('<div class="brand">JOBS</div>')+'<div class="loading"><div class="spin dk"></div></div>';if(!M.crewBusy){M.crewBusy=true;loadCrew().then(function(){M.crewBusy=false;M.crewFailed=!M.crewLoaded;render();});}return;}
    if(M.view==='crewjob'){var j=M.crewJobs.filter(function(z){return z.id===M.qid;})[0];if(j)return renderCrewJob(j);M.view='list';}

  /* ----- spending: jobs ----- */
  function moneyJobs(){
    var jobs=M.quotes.filter(function(x){return (x.status==='approved'||x.status==='ordered'||x.status==='done')&&x.contractPrice;});
    if(!jobs.length)return '<div class="empty"><b>No jobs yet</b>Approved jobs with a price show their profit here.</div>';
    var ym=new Date().toISOString().slice(0,7);var mon={rev:0,profit:0};
    var rows=jobs.map(function(x){var p=jobProfit(x);if(String(x.approvedAt||x.created).slice(0,7)===ym){mon.rev+=p.rev;mon.profit+=p.profit;}
      return '<button class="ln" data-m="openjobq" data-id="'+esc(x.id)+'"><div class="l1"><b>'+esc(x.name||x.id)+' · '+esc(townOf(x.address)||'')+'</b><span>'+(x.type==='repair'?esc(TRADE_LABEL[tradeOf(x)]):'Replacement')+' · '+ST_LABEL[x.status]+' · '+money(p.rev,false)+'</span></div>'+
        '<div class="l2 money" style="color:'+(p.profit<0?'#B3261E':'var(--green)')+'">'+money(p.profit,false)+'<span>'+p.margin+'% margin</span></div></button>';}).join('');
    return '<div class="stats"><div class="stat"><b class="money">'+k(mon.rev)+'</b><span>Sold this month</span></div><div class="stat"><b class="money">'+k(mon.profit)+'</b><span>Profit (est.)</span></div><div class="stat"><b>'+(mon.rev?Math.round(mon.profit/mon.rev*100):0)+'%</b><span>Margin</span></div></div><div class="card">'+rows+'</div>';
  }
