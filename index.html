<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Forte</title>
<meta name="theme-color" content="#13202F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Team Forte">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#13202F;--navy2:#1B2B3D;--red:#FF5440;--red-dk:#E23E2B;--ink:#1C2430;--muted:#5B6675;--line:#DDE2E8;--slate:#F2F4F7;--white:#fff;--green:#1F9D55;--green-bg:#E5F6EC;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Montserrat,"Segoe UI",Arial,sans-serif;background:var(--slate);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
.bar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 0 10px}
.bar .wrap{display:flex;align-items:center;gap:10px;padding-bottom:0;min-height:40px}
.brand{font-weight:800;letter-spacing:.06em;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b{color:var(--red)}
.bar .link{color:#C4CCD6;font-size:13px;font-weight:600;padding:8px 4px}
.back{display:flex;align-items:center;gap:4px;color:#fff;font-weight:700;font-size:15px;padding:8px 8px 8px 0}
.back svg{width:20px;height:20px}
.bar-title{flex:1;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;margin-right:48px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:10px;font-weight:700;font-size:15px;background:var(--red);color:#fff;transition:background .15s}
.btn:active{background:var(--red-dk)}
.btn.block{width:100%}
a.btn{text-decoration:none}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.dark{background:var(--navy);color:#fff}
.btn.danger{background:#fff;color:#C62828;border:1px solid #F3C4C4}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn svg{width:18px;height:18px}
h1{font-size:22px;font-weight:800;margin:20px 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0}
.card h2{font-size:16px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 small{font-weight:600;color:var(--muted);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;color:var(--ink)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--slate);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{min-height:40px;border-radius:8px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(19,32,47,.15)}
.stats{display:flex;gap:10px;margin:14px 0 6px}
.stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:12px;white-space:nowrap;color:var(--muted);font-weight:600}
.jobs{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.job{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;width:100%}
.job .th{width:76px;height:76px;border-radius:9px;background:var(--slate) center/cover no-repeat;flex:none;display:flex;align-items:center;justify-content:center;color:#9AA5B1}
.job .th svg{width:28px;height:28px}
.job .info{flex:1;min-width:0}
.job .t{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .m{color:var(--muted);font-size:13px;margin:2px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--slate);color:var(--muted);letter-spacing:.02em}
.pill.live{background:var(--green-bg);color:var(--green)}
.pill.home{background:#FFE9E5;color:var(--red-dk)}
.chev{color:#9AA5B1;flex:none}
.empty{text-align:center;color:var(--muted);padding:40px 16px;background:#fff;border:1px dashed var(--line);border-radius:var(--r);margin-top:12px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0;padding-top:0}
.toggle .tl b{display:block;font-size:15px}
.toggle .tl span{font-size:13px;color:var(--muted)}
.sw{position:relative;width:52px;height:32px;flex:none;border-radius:999px;background:#C9D1DA;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(20px)}
.stage{margin-top:16px}
.stage:first-of-type{margin-top:0}
.stage-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.stage-h b{font-size:14px;text-transform:uppercase;letter-spacing:.08em}
.stage-h span{font-size:12px;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--slate)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .star{position:absolute;left:6px;top:6px;background:var(--red);color:#fff;border-radius:999px;font-size:10px;font-weight:800;padding:2px 7px;letter-spacing:.04em}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add{aspect-ratio:1;border-radius:9px;border:2px dashed #B9C3CE;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-weight:700;font-size:12px;background:#FAFBFC}
.add svg{width:26px;height:26px;color:var(--red)}
label.f{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
label.f:first-child{margin-top:0}
label.f small{font-weight:500;color:var(--muted)}
.in{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:16px;-webkit-appearance:none;appearance:none}
.in:focus{outline:2px solid rgba(255,84,64,.35);border-color:var(--red)}
textarea.in{min-height:84px;resize:vertical}
.row{display:flex;gap:10px}
.row>*{flex:1}
.mt{margin-top:16px}
.drive{display:flex;align-items:center;gap:8px;color:var(--navy);font-weight:700;font-size:14px;text-decoration:none;padding:12px 0}
.drive svg{width:18px;height:18px}
/* sheets */
.ov{position:fixed;inset:0;z-index:50;background:rgba(19,32,47,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.grab{width:40px;height:5px;border-radius:3px;background:#D0D6DD;margin:4px auto 12px}
.sheet h3{font-size:18px;font-weight:800;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}
.x{width:36px;height:36px;border-radius:50%;background:var(--slate);display:flex;align-items:center;justify-content:center}
.x svg{width:18px;height:18px}
.big{width:100%;border-radius:12px;background:var(--slate);display:block;max-height:52vh;object-fit:contain}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.acts .btn{min-height:44px;font-size:14px;padding:0 10px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.ctile{display:block;text-align:left;min-width:0}
.ctile img{width:100%;aspect-ratio:1;border-radius:10px;display:block;background:#333}
.ctile span{display:block;font-size:12px;font-weight:700;margin-top:5px;line-height:1.25}
.ctile.on img{outline:3px solid var(--red);outline-offset:2px}
.cbig{aspect-ratio:1;object-fit:cover;max-height:none}
.vizov{position:fixed;inset:0;z-index:60;background:#fff;overflow:auto;-webkit-overflow-scrolling:touch}
.vizbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--navy);color:#fff}
.vizbar span{flex:1;font-size:12px;opacity:.75}
.vizbody{padding:0 8px calc(16px + env(safe-area-inset-bottom))}
#visualizer iframe{width:100% !important;border:0}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* progress + toast */
.prog{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--navy);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.prog .wrap{padding-bottom:0}
.prog .l{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:8px}
.prog .track{height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.prog .fill{height:100%;background:var(--red);transition:width .3s}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fade .2s}
.toast.err{background:#B3261E}
/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:var(--navy);color:#fff;padding:24px}
.login .box{max-width:380px;margin:0 auto;width:100%}
.login .logo{font-weight:800;font-size:28px;letter-spacing:.08em;margin-bottom:4px}
.login .logo b{color:var(--red)}
.login p{color:#C4CCD6;margin:0 0 28px}
.login .in{background:#fff;color:var(--ink);text-align:center;font-size:20px;letter-spacing:.2em;font-weight:700}
.login .remember{display:flex;align-items:center;gap:8px;color:#C4CCD6;font-size:14px;margin:14px 0 18px}
.login .remember input{width:18px;height:18px;accent-color:var(--red)}
.login .err{color:#FFB4A8;font-size:14px;min-height:20px;margin-top:10px;text-align:center}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite}
.spin.dk{border-color:rgba(19,32,47,.15);border-top-color:var(--red)}
@keyframes rot{to{transform:rotate(360deg)}}
.loading{display:flex;justify-content:center;padding:60px 0}
.foot{text-align:center;margin-top:26px}
.foot a{color:var(--navy);font-weight:700;font-size:14px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* bottom tabs */
body.has-tabs .wrap{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
body.has-tabs .bar .wrap,body.has-tabs .prog .wrap{padding-bottom:0}
.row{align-items:flex-end}
body.has-tabs .prog{bottom:calc(62px + env(safe-area-inset-bottom))}
body.has-tabs .toast{bottom:calc(80px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:0 0 env(safe-area-inset-bottom)}
.tabs .in2{display:flex;width:100%;max-width:640px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:700;color:#7A8594;position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--red)}
.tab .dot{position:absolute;top:5px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center}
/* materials */
.money{font-variant-numeric:tabular-nums}
.q{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:10px}
.q .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.q .nm{font-weight:800;font-size:16px}
.q .ad{color:var(--muted);font-size:13px;margin:2px 0 8px}
.q .rg{font-weight:800;font-size:15px;white-space:nowrap}
.pill.new{background:#FFE9E5;color:var(--red-dk)}
.pill.approved{background:#E7EEFF;color:#2B4FC7}
.pill.ordered,.pill.Sent,.pill.Requested,.pill.Scheduled,.pill.Pending{background:#FFF4D6;color:#8A5A00}
.pill.done,.pill.Delivered,.pill.Picked{background:var(--green-bg);color:var(--green)}
.pill.Canceled,.pill.Backordered,.pill.Attempted{background:#FDE7E7;color:#B3261E}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0}
.kv span{color:var(--muted)}
.kv b{text-align:right}
.big-n{font-size:28px;font-weight:800;line-height:1.1}
.pkg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pkg button{border:2px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;background:#fff}
.pkg button b{display:block;font-size:14px}
.pkg button span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.pkg button.on{border-color:var(--red);background:#FFF6F4}
.meas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meas label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}
.meas label i{font-style:normal;font-weight:700;font-size:10px;color:#8A5A00;background:#FFF4D6;border-radius:4px;padding:1px 5px;margin-left:4px}
.meas .in{min-height:42px;padding:8px 10px}
.ln{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.ln:first-child{border-top:0}
.ln .l1{flex:1;min-width:0}
.ln .l1 b{display:block;font-size:14px;font-weight:700}
.ln .l1 span{font-size:12px;color:var(--muted)}
.ln .l1 em{font-style:normal;font-size:10px;font-weight:800;color:#8A5A00;background:#FFF4D6;border-radius:4px;padding:1px 5px;margin-left:4px}
.ln .l2{text-align:right;font-weight:800;font-size:14px;white-space:nowrap}
.ln .l2 span{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.cat{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.cat:first-child{margin-top:0}
.tot{border-top:2px solid var(--ink);margin-top:8px;padding-top:8px}
.tot .kv{border:0;padding:3px 0}
.tot .kv.grand{font-size:17px;font-weight:800}
.src{font-size:10px;font-weight:800;border-radius:4px;padding:2px 6px;letter-spacing:.03em}
.src.abc{background:var(--green-bg);color:var(--green)}
.src.manual{background:#E7EEFF;color:#2B4FC7}
.src.starter{background:#FFF4D6;color:#8A5A00}
.note{background:#FFF8E6;border:1px solid #F3DFA8;border-radius:10px;padding:10px 12px;font-size:13px;color:#5C4400;margin:10px 0}
.note.ok{background:var(--green-bg);border-color:#BFE6CF;color:#145C34}
.res{display:block;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.res b{display:block}
.res span{font-size:12px;color:var(--muted)}
.icon-btn{display:inline-flex;align-items:center;gap:6px;color:#fff;font-weight:700;font-size:14px;padding:8px 2px}
.icon-btn svg{width:20px;height:20px}
.meter{height:8px;border-radius:4px;background:var(--slate);overflow:hidden;margin-top:8px}
.meter div{height:100%;background:var(--red)}
.netpill{position:fixed;left:50%;transform:translateX(-50%);top:calc(6px + env(safe-area-inset-top));z-index:60;background:#FFF4E5;color:#7A4B00;border:1px solid #F5D7A6;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;pointer-events:none}
</style>
</head>

<div id="app"></div>

<script>
/* Team Forte materials takeoff (Owens Corning system). Shared by the phone app and the tests. */
var TAKEOFF = (function () {
  'use strict';

  var PACKAGES = [
    { key: 'shingle_oakridge', label: 'Oakridge' },
    { key: 'shingle_duration', label: 'Duration' },
    { key: 'shingle_flex', label: 'Duration FLEX' }
  ];

  /* Default price list. Prices are rough starting numbers until replaced by your supplier's prices. */
  var CATALOG = [
    { key: 'shingle_oakridge', cat: 'Shingles', name: 'Owens Corning Oakridge shingles', unit: 'bundle', price: 42 },
    { key: 'shingle_duration', cat: 'Shingles', name: 'Owens Corning TruDefinition Duration shingles', unit: 'bundle', price: 46 },
    { key: 'shingle_flex', cat: 'Shingles', name: 'Owens Corning Duration FLEX shingles', unit: 'bundle', price: 58 },
    { key: 'hip_ridge', cat: 'Shingles', name: 'OC ProEdge Hip & Ridge (33 LF)', unit: 'bundle', price: 76 },
    { key: 'starter', cat: 'Shingles', name: 'OC Starter Strip Plus (105 LF)', unit: 'bundle', price: 66 },
    { key: 'ice_water', cat: 'Underlayment', name: 'OC WeatherLock G ice & water barrier (2 sq)', unit: 'roll', price: 118 },
    { key: 'underlayment', cat: 'Underlayment', name: 'OC Deck Defense synthetic underlayment (10 sq)', unit: 'roll', price: 165 },
    { key: 'drip_edge', cat: 'Metal & flashing', name: 'Drip edge, aluminum, 10 ft', unit: 'piece', price: 12 },
    { key: 'step_flashing', cat: 'Metal & flashing', name: 'Step flashing 4x4x8 (100 pcs)', unit: 'bundle', price: 48 },
    { key: 'ridge_vent', cat: 'Ventilation', name: 'OC VentSure ridge vent, 4 ft', unit: 'piece', price: 14 },
    { key: 'pipe_boot', cat: 'Ventilation', name: 'Pipe boot flashing', unit: 'each', price: 18 },
    { key: 'coil_nails', cat: 'Fasteners', name: 'Coil roofing nails 1-1/4" (7,200)', unit: 'box', price: 56 },
    { key: 'cap_nails', cat: 'Fasteners', name: 'Plastic cap nails (2,000)', unit: 'box', price: 34 },
    { key: 'sealant', cat: 'Fasteners', name: 'Roof sealant, tube', unit: 'tube', price: 9 },
    { key: 'osb', cat: 'Decking', name: 'OSB roof decking 7/16" 4x8', unit: 'sheet', price: 22 }
  ];

  var DEFAULTS = { waste: 10, iceCourses: 2, pipes: 2, decking: 2, walls: 0 };

  function num(v, d) { v = Number(v); return isFinite(v) ? v : (d || 0); }
  function ceil(v) { return Math.max(0, Math.ceil(v - 1e-9)); }

  function pitchRise(p) {
    var m = String(p || '').match(/(\d+(?:\.\d+)?)\s*(?:\/\s*12)?/);
    return m ? Math.min(30, num(m[1])) : 6;
  }
  function pitchFactor(p) { var r = pitchRise(p) / 12; return Math.sqrt(1 + r * r); }

  /* Google encoded polyline -> [[lat,lng],...] */
  function decodePoly(str) {
    var pts = [], i = 0, lat = 0, lng = 0;
    str = String(str || '');
    while (i < str.length) {
      var res = [0, 0];
      for (var k = 0; k < 2; k++) {
        var shift = 0, result = 0, b;
        do { b = str.charCodeAt(i++) - 63; result |= (b & 31) << shift; shift += 5; } while (b >= 32);
        res[k] = (result & 1) ? ~(result >> 1) : (result >> 1);
      }
      lat += res[0]; lng += res[1];
      pts.push([lat / 1e6, lng / 1e6]);
    }

function wireService(form){

function formData(f){return{service:f.elements.service.value,title:f.elements.title.value,town:f.elements.town.value,date:f.elements.date.value,address:f.elements.address.value,description:f.elements.description.value};}

function saveDetails(f){

    .catch(function(e){b.disabled=false;b.textContent='Save details';toast(e.message,true);});

function merge(r){
  for(var i=0;i<S.jobs.length;i++)if(S.jobs[i].id===r.id){S.jobs[i]=r;sortJobs();return;}
  S.jobs.push(r);sortJobs();
}

function sheet(html,onClose){

  ov.addEventListener('click',function(e){if(e.target===ov||e.target.closest('[data-close]')){closeSheet();if(onClose)onClose();}});
  document.body.appendChild(ov);document.body.style.overflow='hidden';
  return ov;
}
function closeSheet(){var o=document.getElementById('ov');if(o)o.remove();document.body.style.overflow='';}
function closeBtn(){return '<button class="x" data-close aria-label="Close">'+ICON.x+'</button>';}

function confirmBox(title,text,okLabel){

function photoSheet(id){
  var j=job();var p=null;j.photos.forEach(function(x){if(x.id===id)p=x;});if(!p)return;
  var group=photosOf(j,p.stage);var idx=group.indexOf(p);
  var isCover=coverOf(j)===p.id;
  var ov=sheet('<h3>Photo'+closeBtn()+'</h3>'+
    '<img class="big" src="'+esc(img(p.id,1200))+'" alt="">'+
    '<label class="f mt">Stage</label><div class="seg" id="stg">'+STAGES.map(function(s){return '<button type="button" class="'+(s[0]===p.stage?'on':'')+'" data-st="'+s[0]+'">'+s[1]+'</button>';}).join('')+'</div>'+
    '<label class="f">Caption <small>(optional)</small></label><div class="row"><input class="in" id="cap" maxlength="160" placeholder="e.g. Rotted decking found under old shingles" value="'+esc(p.caption||'')+'"><button class="btn dark" id="capb" style="flex:0 0 auto">Save</button></div>'+
    '<div class="acts">'+
      '<button class="btn ghost" id="mvl"'+(idx<=0?' disabled':'')+'>← Move earlier</button>'+
      '<button class="btn ghost" id="mvr"'+(idx>=group.length-1?' disabled':'')+'>Move later →</button>'+
      '<button class="btn ghost" id="cov"'+(isCover?' disabled':'')+'>'+(isCover?'★ Cover photo':'★ Make cover photo')+'</button>'+
      (isCrew()?'<span></span>':'<button class="btn danger" id="del">Delete photo</button>')+
    '</div><p class="hint">The cover photo is the one shown on the website card for this job.</p>');
  function after(r,msg){var k=j.photos.indexOf(p);if(r&&k>=0)j.photos[k]=Object.assign(p,{stage:r.stage||p.stage,caption:r.caption!=null?r.caption:p.caption});resort(j);render();if(msg)toast(msg);}
  ov.querySelector('#stg').onclick=function(e){var b=e.target.closest('button[data-st]');if(!b||b.classList.contains('on'))return;
    var st=b.getAttribute('data-st');
    call('updatePhoto',{id:p.id,stage:st}).then(function(r){p.stage=r.stage;p._o=Date.now();after(r,'Moved to '+st);photoSheet(p.id);}).catch(function(e2){toast(e2.message,true);});
  };
  ov.querySelector('#capb').onclick=function(){var v=ov.querySelector('#cap').value;
    call('updatePhoto',{id:p.id,caption:v}).then(function(r){closeSheet();after(r,'Caption saved');}).catch(function(e2){toast(e2.message,true);});
  };
  function mv(dir){call('movePhoto',{id:p.id,dir:dir}).then(function(){
      var g=photosOf(j,p.stage);var i=g.indexOf(p),k=i+dir;if(k<0||k>=g.length)return;
      var a=j.photos.indexOf(g[i]),b2=j.photos.indexOf(g[k]);var t=j.photos[a];j.photos[a]=j.photos[b2];j.photos[b2]=t;
      render();photoSheet(p.id);
    }).catch(function(e2){toast(e2.message,true);});}
  ov.querySelector('#mvl').onclick=function(){mv(-1);};
  ov.querySelector('#mvr').onclick=function(){mv(1);};
  ov.querySelector('#cov').onclick=function(){
    call('saveJob',{id:j.id,coverId:p.id}).then(function(r){merge(r);closeSheet();render();toast('Cover photo set');}).catch(function(e2){toast(e2.message,true);});
  };
  if(ov.querySelector('#del'))ov.querySelector('#del').onclick=function(){
    confirmBox('Delete this photo?','It will be removed from the website and moved to the trash in Google Drive.','Delete').then(function(ok){
      if(!ok){photoSheet(p.id);return;}
      call('deletePhoto',{id:p.id}).then(function(){j.photos=j.photos.filter(function(x){return x.id!==p.id;});if(j.coverId===p.id)j.coverId='';render();toast('Photo deleted');})
        .catch(function(e2){toast(e2.message,true);});
    });
  };
}

function resort(j){
  var rank={before:0,during:1,after:2};
  j.photos.forEach(function(p,i){p._i=p._o?1e9+p._o:i;});
  j.photos.sort(function(a,b){return (rank[a.stage]-rank[b.stage])||(a._i-b._i);});
  j.photos.forEach(function(p){delete p._i;delete p._o;});
}

/* ---------- uploads ---------- */
function shrink(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file);var im=new Image();
    im.onload=function(){
      try{
        var w=im.naturalWidth,h=im.naturalHeight,max=2000,s=Math.min(1,max/Math.max(w,h));
        var cw=Math.round(w*s),ch=Math.round(h*s);
        var cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
        var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cw,ch);cx.drawImage(im,0,0,cw,ch);
        var full=cv.toDataURL('image/jpeg',0.82);
        var ts=Math.min(1,500/Math.max(cw,ch));var tv=document.createElement('canvas');tv.width=Math.round(cw*ts);tv.height=Math.round(ch*ts);
        tv.getContext('2d').drawImage(cv,0,0,tv.width,tv.height);
        URL.revokeObjectURL(url);
        res({base64:full.split(',')[1],width:cw,height:ch,thumb:tv.toDataURL('image/jpeg',0.8)});
      }catch(e){URL.revokeObjectURL(url);rej(e);}
    };
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('Couldn’t read '+(file.name||'that photo')+'. Try a JPG.'));};
    im.src=url;
  });
}

function upload(files,stage){
  var j=job();if(!j||!files.length)return;
  var list=Array.prototype.slice.call(files,0,30);
  S.upload={total:list.length,done:0,failed:0};drawProg();
  var errs=[];
  var seq=Promise.resolve();
  list.forEach(function(file){
    seq=seq.then(function(){
      return shrink(file).then(function(sh){
        return call('uploadPhoto',{jobId:j.id,stage:stage,base64:sh.base64,mime:'image/jpeg',width:sh.width,height:sh.height}).then(function(p){
          S.prev[p.id]=sh.thumb;
          j.photos.push({id:p.id,stage:p.stage,caption:p.caption,w:p.width,h:p.height});resort(j);
        });
      }).catch(function(e){S.upload.failed++;errs.push(e.message);})
      .then(function(){S.upload.done++;drawProg();if(S.view==='job')renderKeepScroll();});
    });
  });
  seq.then(function(){
    var u=S.upload;S.upload=null;drawProg();
    if(u.failed)toast(u.failed+' of '+u.total+' didn’t upload: '+errs[0],true);
    else toast(u.total+' photo'+(u.total===1?'':'s')+' added'+(j.published?'. Live on the website.':'.'));
  });
}

function renderKeepScroll(){var y=window.scrollY;render();window.scrollTo(0,y);}

function drawProg(){
  var el=document.getElementById('prog');
  if(!S.upload){if(el)el.remove();return;}
  if(!el){el=document.createElement('div');el.id='prog';el.className='prog';document.body.appendChild(el);}
  var u=S.upload,n=Math.min(u.done+1,u.total);
  el.innerHTML='<div class="wrap"><div class="l"><span>'+(u.done<u.total?'Uploading '+n+' of '+u.total+'…':'Finishing…')+'</span><span>'+Math.round(u.done/u.total*100)+'%</span></div><div class="track"><div class="fill" style="width:'+Math.max(4,u.done/u.total*100)+'%"></div></div></div>';
}

picker.addEventListener('change',function(){var f=picker.files;if(f&&f.length)upload(f,pickStage);picker.value='';});

/* ---------- events ---------- */
app.addEventListener('click',function(e){
  var m=e.target.closest('[data-m]');if(m){MAT.click(m,e);return;}
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.getAttribute('data-act');
  if(a==='tab'){S.tab=t.getAttribute('data-v');store('tfp_tab',S.tab);if(S.tab==='photos')S.view='home';MAT.home();render();window.scrollTo(0,0);return;}
  if(a==='logout'){logout('');return;}
  if(a==='new'){newJobSheet();return;}
  if(a==='filter'){S.filter=t.getAttribute('data-v');render();return;}
  if(a==='open'){S.jobId=t.getAttribute('data-id');S.view='job';render();window.scrollTo(0,0);return;}
  if(a==='home'){S.view='home';render();window.scrollTo(0,0);return;}
  if(a==='photo'){photoSheet(t.getAttribute('data-id'));return;}
  if(a==='add'){if(S.upload){toast('Wait for the current upload to finish.');return;}pickStage=t.getAttribute('data-stage');picker.click();return;}
  if(a==='tog'){
    var j=job(),k=t.getAttribute('data-k'),v=!j[k],d={id:j.id};d[k]=v;
    if(k==='featured'&&v&&!j.published){d.published=true;}
    t.classList.toggle('on',v);
    call('saveJob',d).then(function(r){merge(r);render();
      toast(k==='published'?(v?'Showing on the website':'Hidden from the website'):(v?'Showing on the homepage':'Removed from the homepage'));
    }).catch(function(err){t.classList.toggle('on',!v);toast(err.message,true);});
    return;
  }
  if(a==='deljob'){
    var jj=job();
    confirmBox('Delete “'+jj.title+'”?','This removes the job and its '+jj.photos.length+' photo'+(jj.photos.length===1?'':'s')+' from the website and moves them to the trash in Google Drive.','Delete job').then(function(ok){
      if(!ok)return;
      call('deleteJob',{id:jj.id}).then(function(){S.jobs=S.jobs.filter(function(x){return x.id!==jj.id;});S.view='home';render();toast('Job deleted');})
        .catch(function(err){toast(err.message,true);});
    });
  }
});

/* ================= Quotes, materials, orders, spending ================= */
var MAT=(function(){
  var M={pricing:TAKEOFF.cleanPricing(null),est:null,repairs:{min:0,items:[]},inspections:[],tags:[],crewJobs:[],crewLoaded:false,execUrl:'',loaded:false,quotes:[],orders:[],prices:[],settings:{suppliers:[],abc:{}},owner:'',
    view:'list',qid:null,qfilter:'new',money:'orders',mview:'home',draft:null};
  var PK=TAKEOFF.PACKAGES;
  var ST_LABEL={new:'New',approved:'Approved',ordered:'Ordered',done:'Done',archived:'Archived'};
  var DELIVERY=[['OTR','Roof load'],['OTG','Ground drop'],['CPU','Pick up']];
  var GEAR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';

  /* ---------- helpers ---------- */
  function money(n,cents){n=Number(n)||0;if(n<0)return '\u2212'+money(-n,cents);return '$'+n.toLocaleString('en-US',{minimumFractionDigits:cents===false?0:2,maximumFractionDigits:cents===false?0:2});}
  function k(n){n=Number(n)||0;return n>=1000?'$'+(Math.round(n/100)/10).toString().replace(/\.0$/,'')+'k':money(n,false);}
  function q(){for(var i=0;i<M.quotes.length;i++)if(M.quotes[i].id===M.qid)return M.quotes[i];return null;}
  function priceMap(){var o={};M.prices.forEach(function(p){o[p.key]=p;});return o;}
  function dateStr(iso){if(!iso)return'';var d=new Date(iso);if(isNaN(d))return String(iso).slice(0,10);return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:d.getFullYear()===new Date().getFullYear()?undefined:'numeric'});}
  function sqft(qq){return (qq.roofs||[]).reduce(function(n,r){return n+(Number(r.s)||0);},0);}
  function range(qq,i){var r=(qq.ranges||[])[i];return r&&r[1]?money(r[0],false)+'–'+money(r[1],false):'';}
  function mid(qq,i){var r=(qq.ranges||[])[i];return r&&r[1]?Math.round((r[0]+r[1])/2/100)*100:0;}
  function townOf(a){var p=String(a||'').split(',');return p.length>=3?p[p.length-2].trim():'';}
  function parseAddr(a){var p=String(a||'').split(',').map(function(x){return x.trim();});var o={line1:p[0]||'',city:'',state:'CT',postal:''};
    if(p.length>=3){o.city=p[p.length-2];var m=p[p.length-1].match(/([A-Z]{2})\s*(\d{5})?/i);if(m){o.state=m[1].toUpperCase();o.postal=m[2]||'';}}else if(p.length===2){o.city=p[1];}
    return o;}
  function orderSpend(o){return o.status==='Canceled'?0:(o.actualTotal!==''&&o.actualTotal!=null?Number(o.actualTotal):Number(o.total)||0);}
  function lineTotal(l){return (Number(l.qty)||0)*(Number(l.price)||0);}
  function addDays(n){var d=new Date();var added=0;while(added<n){d.setDate(d.getDate()+1);if(d.getDay()!==0&&d.getDay()!==6)added++;}return d.toISOString().slice(0,10);}
  function mergeQ(r){for(var i=0;i<M.quotes.length;i++)if(M.quotes[i].id===r.id){M.quotes[i]=r;return r;}M.quotes.unshift(r);return r;}
  function fresh(qq){
    // keep line prices in step with the price list unless you typed a price for that job
    var pm=priceMap();
    return (qq.lines||[]).map(function(l){var p=pm[l.key];var c=Object.assign({},l);
      if(p&&!l.custom){if(!l.priceManual)c.price=p.price;if(!l.itemManual){c.abcItem=p.abcItem;c.uom=p.uom;}c.name=p.name;c.unit=p.unit;}return c;});
  }
  function err(e){toast(e.message||String(e),true);}
  function units(u,n){u=String(u||'');if(n===1||u==='each'||!u||/^[A-Z]+$/.test(u))return u;if(/(x|ch|sh|s)$/.test(u))return u+'es';return u+'s';}

  function apply(d){M.quotes=d.quotes||[];M.orders=d.orders||[];M.prices=d.prices||[];M.settings=d.settings||M.settings;M.pricing=d.pricing||TAKEOFF.cleanPricing(null);M.owner=d.owner||'';M.repairs=d.repairs||M.repairs;M.inspections=d.inspections||[];M.tags=d.tags||[];M.execUrl=d.execUrl||'';M.loaded=true;}
  function load(){return call('matList').then(function(d){apply(d);cacheMerge('mat',d);})
    .catch(function(e){toast(e.message,true);});}

  /* ---------- router ---------- */
  function renderMat(){
    if(S.tab==='jobs')return renderCrew();
    if(!M.loaded){
      if(M.failed){app.innerHTML=bar('<div class="brand">TEAM <b>FORTE</b></div>')+'<div class="wrap"><div class="empty"><b>Couldn\u2019t load</b>Check your signal and try again.<div class="mt"><button class="btn ghost" data-m="retry">Try again</button></div></div></div>';return;}
      app.innerHTML=bar('<div class="brand">TEAM <b>FORTE</b></div>')+'<div class="loading"><div class="spin dk"></div></div>';
      if(!M.loading){M.loading=true;load().then(function(){M.loading=false;M.failed=!M.loaded;render();});}
      return;
    }
    if(S.tab==='quotes'){if(M.view==='quote'&&q())return renderQuote();if(M.view==='new')return renderNew();if(M.view==='pricing')return renderPricing();M.view='list';return renderQuotes();}
    if(M.mview==='settings')return renderSettings();
    return renderMoney();
  }

  /* ---------- quotes list ---------- */
  function renderQuotes(){
    var counts={new:0,approved:0,ordered:0,done:0};
    M.quotes.forEach(function(x){if(counts[x.status]!=null)counts[x.status]++;});
    var list=M.quotes.filter(function(x){return x.status===M.qfilter;});
    var warr=M.quotes.filter(function(x){return x.status==='done'&&!x.warrantyDone&&x.type!=='repair';}).length;
    var dep=M.quotes.filter(function(x){return x.signedAt&&x.depositStatus==='requested';}).length;
    var h=bar('<div class="brand">QUOTES</div><button class="icon-btn" data-m="pricing" aria-label="Quote prices">'+GEAR+'</button><button class="icon-btn" data-m="newest" style="margin-left:10px">'+ICON.plus+'New estimate</button>')+'<div class="wrap">'+
      '<div class="chips mt">'+[['new','New'],['approved','Approved'],['ordered','Ordered'],['done','Done']].map(function(f){
        return '<button class="chip'+(M.qfilter===f[0]?' on':'')+'" data-m="qf" data-v="'+f[0]+'">'+f[1]+(counts[f[0]]?' ('+counts[f[0]]+')':'')+'</button>';}).join('')+'<button class="chip" data-m="colors">Shingle colors</button></div>'+
      (warr?'<div class="note">'+warr+' finished job'+(warr===1?'':'s')+' still need'+(warr===1?'s':'')+' the warranty registered. See Done.</div>':'')+
      (dep?'<div class="note">'+dep+' signed job'+(dep===1?' is':'s are')+' waiting on a deposit.</div>':'');
    if(!list.length){
      h+='<div class="empty"><b>'+(M.qfilter==='new'?'No new quotes':'Nothing here yet')+'</b>'+
        (M.qfilter==='new'?'Quotes from the website’s instant quote show up here on their own. You can also paste a quote link.':'Approve a quote to start its materials list.')+
        (M.qfilter==='new'?'<div class="mt"><button class="btn ghost" data-m="addlink">Paste a quote link</button></div>':'')+'</div>';
    }else{
      h+=list.map(function(x){
        var pk=PK[x.pick];var pr=x.contractPrice?money(x.contractPrice,false):(x.pick>=0?range(x,x.pick):range(x,0));
        return '<button class="q" data-m="openq" data-id="'+esc(x.id)+'"><div class="top"><div style="min-width:0"><div class="nm">'+esc(x.name||(x.source==='app'?'Customer':'Website visitor'))+'</div>'+
          '<div class="ad">'+esc(x.address||'')+'</div></div><div class="rg money">'+esc(pr)+'</div></div>'+
          '<div class="pills"><span class="pill '+x.status+'">'+ST_LABEL[x.status]+'</span>'+
          (x.type==='repair'?'<span class="pill">Repair · '+(x.items||[]).length+' item'+((x.items||[]).length===1?'':'s')+'</span>':'<span class="pill">'+Math.round(sqft(x)).toLocaleString()+' sq ft</span>')+
          (x.signedAt?'<span class="pill done">✓ Signed</span>':x.proposalSentAt?'<span class="pill">Sent for signature</span>':'')+
          (pk?'<span class="pill">OC '+esc(pk.label)+(x.color?' · '+esc(x.color):'')+'</span>':'')+
          '<span class="pill">'+(x.source==='app'?'App estimate · ':'')+esc(x.id)+' · '+dateStr(x.created)+'</span></div></button>';
      }).join('');
    }
    app.innerHTML=h+'</div>';
  }

  function addLinkSheet(){
    var ov=sheet('<h3>Add a quote'+closeBtn()+'</h3><p class="sub">Paste the quote link from the customer’s GoHighLevel contact (Quote Link field) or the quote email.</p>'+
      '<textarea class="in" id="ql" placeholder="https://team-forte.com/quote#q=…" style="min-height:110px"></textarea><button class="btn block mt" id="qlb">Add quote</button>');
    ov.querySelector('#qlb').onclick=function(){var b=this;var v=ov.querySelector('#ql').value.trim();if(!v)return;b.disabled=true;b.textContent='Adding…';
      call('addQuote',{link:v}).then(function(r){mergeQ(r);closeSheet();M.qid=r.id;M.view='quote';M.qfilter=r.status;render();window.scrollTo(0,0);toast('Quote added');})
        .catch(function(e){b.disabled=false;b.textContent='Add quote';err(e);});};
  }

  /* ---------- quote detail ---------- */
  function renderQuote(){
    var x=q();
    var h=bar('<button class="back" data-m="back">'+ICON.back+'Quotes</button><div class="bar-title">'+esc(x.name||x.id)+'</div>')+'<div class="wrap">';
    var rep=x.type==='repair';
    h+='<div class="card"><h2>'+esc(x.name||(x.source==='app'?'Customer':'Website visitor'))+' <span><span class="pill '+x.status+'">'+ST_LABEL[x.status]+'</span> <button class="link" style="color:var(--navy);font-size:13px;font-weight:700;padding:4px" data-m="editcust">Edit</button></span></h2>'+
      (x.phone?kv('Phone','<a href="tel:'+esc(x.phone.replace(/[^\d+]/g,''))+'" target="_top">'+esc(x.phone)+'</a>'):'')+
      (x.email?kv('Email','<a href="mailto:'+esc(x.email)+'" target="_top">'+esc(x.email)+'</a>'):'')+
      kv('Address','<a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.address||(x.lat+','+x.lng))+'" target="_blank" rel="noopener">'+esc(x.address||'Map')+'</a>')+
      kv('Quote',esc(x.id)+' · '+dateStr(x.created))+
      (x.roofs||[]).map(function(r){return kv(esc(r.n||'Roof'),Math.round(r.s).toLocaleString()+' sq ft · '+esc(r.p||'pitch ?'));}).join('')+
      (x.layers>1?kv('Layers to tear off',String(x.layers)):'')+
      (x.link&&!rep?'<div class="acts"><button class="btn" data-m="share">Send quote</button><a class="btn ghost" href="'+esc(x.link)+'" target="_blank" rel="noopener">View quote page</a></div>':'')+
      ghlLine(x)+'</div>';
    if(rep)h+=repairCard(x);
    h+=proposalCard(x);
    if(x.status==='new')h+=rep?approveRepairCard(x):approveCard(x);

  }

  function kv(a,b){return '<div class="kv"><span>'+a+'</span><b>'+b+'</b></div>';}

  function approveCard(x){
    var pick=M.draft&&M.draft.id===x.id?M.draft.pick:(x.pick>=0?x.pick:1);
    var price=M.draft&&M.draft.id===x.id?M.draft.price:(x.contractPrice||mid(x,pick));
    return '<div class="card"><h2>Approve job</h2>'+
      '<label class="f">Package</label><div class="pkg" id="pkg">'+PK.map(function(p,i){return '<button type="button" class="'+(i===pick?'on':'')+'" data-pk="'+i+'"><b>'+p.label+'</b><span>'+(range(x,i)||' ')+'</span></button>';}).join('')+'</div>'+
      '<div class="row"><div><label class="f">Color</label><input class="in" id="qc" maxlength="40" value="'+esc(x.color||'')+'" placeholder="e.g. Estate Gray"></div>'+
      '<div><label class="f">Job price</label><input class="in money" id="qp" inputmode="decimal" value="'+(price||'')+'" placeholder="$"></div></div>'+
      '<p class="hint">Approving builds the materials list from the quote’s roof measurements and adds the job to Photos.</p>'+
      '<button class="btn block mt" data-m="approve">Approve job &amp; build materials list</button>'+
      '<button class="btn ghost block mt" data-m="archive">Not going ahead</button></div>';
  }

  function jobCards(x){
    var ls=fresh(x);
    var t=TAKEOFF.totals(ls,M.settings.taxRate);
    var mine=M.orders.filter(function(o){return o.quoteId===x.id;});
    var spent=mine.reduce(function(n,o){return n+orderSpend(o);},0);
    var pct=x.contractPrice?Math.round(t.total/x.contractPrice*100):0;
    var h='<div class="card"><h2>Job <small>'+(x.type==='repair'?'Repair':'OC '+esc((PK[x.pick]||{}).label||'')+(x.color?' · '+esc(x.color):''))+'</small></h2>'+
      '<div class="row"><div><span class="hint">Job price</span><div class="big-n money">'+(x.contractPrice?money(x.contractPrice,false):'—')+'</div></div>'+
      '<div><span class="hint">Materials (est.)</span><div class="big-n money">'+money(t.total,false)+'</div></div></div>'+
      (x.contractPrice?'<div class="meter" aria-label="Materials are '+pct+'% of the job price"><div style="width:'+Math.min(100,pct)+'%"></div></div><p class="hint">Materials are about '+pct+'% of the job price'+(spent?' · ordered so far: '+money(spent,false):'')+'</p>':'')+
      '<div class="acts"><button class="btn ghost" data-m="editjob">Edit price</button>'+
      (x.photoJobId?'<button class="btn ghost" data-m="photos">Job photos</button>':'<span></span>')+'</div></div>';

    var m=x.meas||{};var est=m.est||{};var skipMeas=x.type==='repair';
    function f(key,label,unit){return '<div><label for="m_'+key+'">'+label+(est[key]?'<i>est.</i>':'')+'</label><input class="in money" id="m_'+key+'" data-meas="'+key+'" inputmode="numeric" value="'+(m[key]!=null?m[key]:'')+'"'+(unit?' aria-label="'+label+' in '+unit+'"':'')+'></div>';}
    if(!skipMeas)h+='<div class="card"><h2>Roof measurements <small>'+(Object.keys(est).length?'Check the est. numbers on site':'')+'</small></h2><div class="meas">'+
      f('area','Roof area (sq ft)')+'<div><label>Pitch</label><input class="in" data-meas="pitch" value="'+esc(m.pitch||'')+'"></div>'+
      f('eaves','Eaves (ft)')+f('rakes','Rakes (ft)')+f('ridges','Ridges (ft)')+f('hips','Hips (ft)')+f('valleys','Valleys (ft)')+f('walls','Wall flashing (ft)')+
      f('pipes','Pipe boots')+f('decking','Decking sheets')+f('waste','Waste %')+f('iceCourses','Ice & water rows at eaves')+'</div>'+
      '<button class="btn dark block mt" data-m="recalc">Update materials list</button></div>';

    h+='<div class="card"><h2>Materials <small>'+ls.length+' items</small></h2><div id="lines">';
    var lastCat='';
    ls.forEach(function(l,i){
      if(l.cat!==lastCat){h+='<div class="cat">'+esc(l.cat||'Other')+'</div>';lastCat=l.cat;}
      h+='<button class="ln" data-m="line" data-i="'+i+'"><div class="l1"><b>'+esc(l.name)+(l.manual?'<em>edited</em>':'')+'</b><span class="money">'+l.qty+' '+esc(units(l.unit,l.qty))+' × '+money(l.price)+(l.abcItem?' · #'+esc(l.abcItem):'')+'</span></div><div class="l2 money">'+money(lineTotal(l))+'</div></button>';
    });
    h+='</div><button class="btn ghost block mt" data-m="addline">'+ICON.plus+'Add item</button>'+
      '<div class="tot">'+kv('Subtotal','<span class="money">'+money(t.subtotal)+'</span>')+kv('Sales tax ('+(M.settings.taxRate||0)+'%)','<span class="money">'+money(t.tax)+'</span>')+
      '<div class="kv grand"><span>Total</span><b class="money">'+money(t.total)+'</b></div></div>'+
      (M.prices.some(function(p){return p.source==='starter';})?'<div class="note">Some prices are starter estimates. Update them under Spending › Prices, or connect ABC Supply for your account prices.</div>':'')+
      '<button class="btn block mt" data-m="order" data-v="abc"'+(M.settings.abc&&M.settings.abc.connected?'':' disabled')+'>Order from ABC Supply</button>'+
      (M.settings.abc&&M.settings.abc.connected?'':'<p class="hint" style="text-align:center">Connect ABC Supply in Spending › Settings to order here.</p>')+
      '<button class="btn ghost block mt" data-m="order" data-v="email">Send order by email</button></div>';

    if(mine.length){
      h+='<div class="card"><h2>Orders for this job</h2>'+mine.map(orderRow).join('')+'</div>';
    }
    h+='<div class="card">'+kv('Status','<span class="pill '+x.status+'">'+ST_LABEL[x.status]+'</span>')+
      '<div class="acts">'+(x.status!=='done'?'<button class="btn ghost" data-m="status" data-v="done">Mark job done</button>':'<button class="btn ghost" data-m="status" data-v="approved">Reopen</button>')+
      '<button class="btn danger" data-m="archive">Archive</button></div></div>';
    return h;
  }

  function wireQuote(x){
    var pk=document.getElementById('pkg');
    if(pk)pk.onclick=function(e){var b=e.target.closest('[data-pk]');if(!b)return;var i=+b.getAttribute('data-pk');
      var priceEl=document.getElementById('qp');var cur=Number(priceEl.value)||0;var old=M.draft&&M.draft.id===x.id?M.draft.pick:(x.pick>=0?x.pick:1);
      M.draft={id:x.id,pick:i,price:(!cur||cur===mid(x,old))?mid(x,i):cur};
      var c=document.getElementById('qc').value;x.color=c;render();};
  }

  function readMeas(x){
    var m=Object.assign({},x.meas||{});var est=Object.assign({},m.est||{});
    document.querySelectorAll('[data-meas]').forEach(function(el){
      var key=el.getAttribute('data-meas');
      if(key==='pitch'){m.pitch=el.value.trim();return;}
      var v=Number(String(el.value).replace(/[^\d.]/g,''))||0;
      if(m[key]!==v)delete est[key];
      m[key]=v;
    });
    m.est=est;return m;
  }

  function saveQ(args,msg){
    args.id=M.qid;
    return call('saveQuote',args).then(function(r){mergeQ(r);render();if(msg)toast(msg);return r;}).catch(function(e){err(e);throw e;});
  }

  function approve(){
    var x=q();var pick=M.draft&&M.draft.id===x.id?M.draft.pick:(x.pick>=0?x.pick:1);
    var price=Number(String(document.getElementById('qp').value).replace(/[^\d.]/g,''))||0;
    var color=document.getElementById('qc').value.trim();
    var m=TAKEOFF.estimate(x.roofs||[]);
    m.waste=M.settings.waste!=null?M.settings.waste:m.waste;m.iceCourses=M.settings.iceCourses!=null?M.settings.iceCourses:m.iceCourses;
    var ls=TAKEOFF.lines(m,pick,priceMap(),[]);
    var b=document.querySelector('[data-m=approve]');if(b){b.disabled=true;b.textContent='Approving…';}
    saveQ({status:'approved',pick:pick,color:color,contractPrice:price,meas:m,lines:ls}).then(function(r){
      M.draft=null;M.qfilter='approved';toast('Approved. Materials list is ready.');
      call('list').then(function(d){S.jobs=d.jobs||[];cacheMerge('list',d);}).catch(function(){});
      return r;
    }).catch(function(){if(b){b.disabled=false;b.textContent='Approve job & build materials list';}});
  }

  function recalc(){
    var x=q();var m=readMeas(x);
    var ls=TAKEOFF.lines(m,x.pick,priceMap(),x.lines);
    saveQ({meas:m,lines:ls},'Materials list updated');
  }

    var ov=sheet('<h3>'+esc(l.name)+closeBtn()+'</h3>'+
      '<div class="row"><div><label class="f">Quantity ('+esc(units(l.unit,2))+')</label><input class="in money" id="lq" inputmode="numeric" value="'+l.qty+'"></div>'+
      '<div><label class="f">Price per '+esc(l.unit)+'</label><input class="in money" id="lp" inputmode="decimal" value="'+l.price+'"></div></div>'+
      (l.calc!=null&&!l.custom?'<p class="hint">Calculated: '+l.calc+' '+esc(l.unit)+'s from the roof measurements.</p>':'')+
      '<p class="hint">Changing the price here only affects this job. To change it for every job, edit it in Spending › Prices.</p>'+
      '<label class="f">ABC item # for this job <small>(e.g. the shingle color)</small></label><div class="row"><input class="in" id="li" maxlength="40" value="'+esc(l.abcItem||'')+'"><input class="in" id="lu" maxlength="10" style="flex:0 0 84px" placeholder="UOM" value="'+esc(l.uom||'')+'"></div>'+
      (M.settings.abc&&M.settings.abc.connected?'<div class="row" style="margin-top:8px"><input class="in" id="lsq" value="'+esc(((x.color?x.color+' ':'')+(/^shingle_/.test(l.key)?((PK.filter(function(p){return p.key===l.key;})[0]||{}).label||''):l.key==='hip_ridge'?'ProEdge':l.name)).trim())+'"><button class="btn dark" id="lsb" style="flex:0 0 auto">Search ABC</button></div><div id="lsr"></div>':'')+
      '<div class="acts">'+(l.manual||l.priceManual?'<button class="btn ghost" id="lr">Reset to calculated</button>':'<span></span>')+'<button class="btn danger" id="ld">Remove</button></div>'+
      '<button class="btn block mt" id="ls">Save</button>');
    ov.querySelector('#ls').onclick=function(){
      var qty=Math.max(0,Math.round(Number(ov.querySelector('#lq').value)||0));var price=Math.max(0,Number(ov.querySelector('#lp').value)||0);
      var nl=fresh(x);var it=nl[i];

      if(ni!==(it.abcItem||'')||nu!==(it.uom||'')){it.abcItem=ni;it.uom=nu;it.itemManual=true;}
      closeSheet();saveQ({lines:nl},'Saved');
    };
    var sb=ov.querySelector('#lsb');if(sb)sb.onclick=function(){
      var r=ov.querySelector('#lsr');r.innerHTML='<div class="loading" style="padding:16px"><div class="spin dk"></div></div>';
      call('abcSearch',{q:ov.querySelector('#lsq').value}).then(function(items){
        r.innerHTML=items.length?items.map(function(it){return '<button class="res" data-it="'+esc(it.itemNumber)+'" data-u="'+esc(it.uom)+'"><b>'+esc(it.description)+'</b><span>#'+esc(it.itemNumber)+(it.uom?' · '+esc(it.uom):'')+'</span></button>';}).join(''):'<p class="hint">No matches.</p>';
      }).catch(function(e){r.innerHTML='';err(e);});
    };
    ov.addEventListener('click',function(e){var b=e.target.closest('[data-it]');if(!b)return;ov.querySelector('#li').value=b.getAttribute('data-it');ov.querySelector('#lu').value=b.getAttribute('data-u');ov.querySelector('#lsr').innerHTML='';toast('Picked. Tap Save.');});
    var r=ov.querySelector('#lr');if(r)r.onclick=function(){var nl=fresh(x);nl[i].manual=false;nl[i].priceManual=false;nl[i].itemManual=false;nl[i].qty=nl[i].calc;
      var pm=priceMap();if(pm[nl[i].key])nl[i].price=pm[nl[i].key].price;closeSheet();saveQ({lines:TAKEOFF.lines(x.meas||{},x.pick,pm,nl)},'Reset');};
    ov.querySelector('#ld').onclick=function(){var nl=fresh(x);
      if(nl[i].custom)nl.splice(i,1);else{nl[i].qty=0;nl[i].manual=true;}
      closeSheet();saveQ({lines:nl},'Removed');};
  }

      closeSheet();saveQ({lines:nl},'Item added');
    };

    ov.querySelector('#ogo').onclick=function(){

  /* ---------- spending ---------- */
  function renderMoney(){
    var now=new Date();var ym=now.toISOString().slice(0,7);var prev=new Date(now.getFullYear(),now.getMonth()-1,1);var pym=prev.getFullYear()+'-'+('0'+(prev.getMonth()+1)).slice(-2);
    var sums={m:0,p:0,y:0};
    M.orders.forEach(function(o){var c=String(o.created);var v=orderSpend(o);if(c.slice(0,7)===ym)sums.m+=v;if(c.slice(0,7)===pym)sums.p+=v;if(c.slice(0,4)===String(now.getFullYear()))sums.y+=v;});
    var h=bar('<div class="brand">SPENDING</div><button class="icon-btn" data-m="settings" aria-label="Settings">'+GEAR+'</button>')+'<div class="wrap">'+
      '<div class="stats"><div class="stat"><b class="money">'+k(sums.m)+'</b><span>This month</span></div><div class="stat"><b class="money">'+k(sums.p)+'</b><span>Last month</span></div><div class="stat"><b class="money">'+k(sums.y)+'</b><span>This year</span></div></div>'+
      '<div class="seg mt">'+[['orders','Orders'],['jobs','Jobs'],['prices','Prices']].map(function(t){return '<button class="'+(M.money===t[0]?'on':'')+'" data-m="mtab" data-v="'+t[0]+'">'+t[1]+'</button>';}).join('')+'</div>';
    if(M.money==='jobs'){h+=moneyJobs();}
    else if(M.money==='orders'){
      h+=M.orders.length?'<div class="card">'+M.orders.map(orderRow).join('')+'</div>':'<div class="empty"><b>No orders yet</b>Approve a quote, then order its materials from the Quotes tab.</div>';
    }else{
      var s=M.settings.abc||{};
      h+=s.connected?'<div class="note ok">ABC Supply prices'+(s.lastRefresh?' updated '+dateStr(s.lastRefresh)+' ('+esc(s.lastRefreshResult||'')+')':' not refreshed yet')+'. They refresh every morning.<div class="mt"><button class="btn ghost" data-m="refresh">Refresh now</button></div></div>':
        '<div class="note">Prices marked <b>Starter</b> are rough estimates. Tap an item to enter your supplier’s price, or connect ABC Supply (Settings) to keep prices updated on their own.</div>';
      h+='<p class="hint">Shingle and ridge cap item numbers depend on the color. Link your most common color here, and change it per job on the materials list.</p>';
      var lastCat='';h+='<div class="card">';
      M.prices.slice().sort(function(a,b){return String(a.cat).localeCompare(String(b.cat));}).forEach(function(p){
        if(p.cat!==lastCat){h+='<div class="cat">'+esc(p.cat||'Other')+'</div>';lastCat=p.cat;}
        var src=p.source==='abc'?'<span class="src abc">ABC</span>':p.source==='starter'?'<span class="src starter">Starter</span>':'<span class="src manual">Yours</span>';
        h+='<button class="ln" data-m="price" data-k="'+esc(p.key)+'"><div class="l1"><b>'+esc(p.name)+'</b><span>'+src+(p.abcItem?' · ABC #'+esc(p.abcItem):'')+' · '+dateStr(p.updated)+'</span></div><div class="l2 money">'+money(p.price)+'<span>per '+esc(p.unit)+'</span></div></button>';
      });
      h+='</div><button class="btn ghost block" data-m="price" data-k="">'+ICON.plus+'Add item</button>';
    }
    app.innerHTML=h+'</div>';
  }

  function saveSettings(f,env){
    var sups=[];f.querySelectorAll('.sup').forEach(function(r){var n=r.querySelector('[data-sn]').value.trim(),e=r.querySelector('[data-se]').value.trim();if(n||e)sups.push({name:n,email:e});});
    var bad=sups.filter(function(x){return !x.name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x.email);});
    if(bad.length){toast('Each supplier needs a name and a valid email.',true);return Promise.reject(new Error('bad'));}
    var el=f.elements;
    var args={contactName:el.contactName.value,contactPhone:el.contactPhone.value,taxRate:el.taxRate.value,waste:el.waste.value,iceCourses:el.iceCourses.value,suppliers:sups};
    if(el.clientId)args.abc={env:env,clientId:el.clientId.value,shipTo:el.shipTo.value,branch:el.branch.value,branchName:el.branchName.value,secret:el.secret.value};
    if(el.co_name)Object.assign(args,extraSettingsArgs(f));
    return call('saveSettings',args).then(function(r){M.settings=r;render();toast('Settings saved');return r;}).catch(function(e){err(e);throw e;});
  }

      return scan.solar(lat,lng).then(function(main){
        if(!main||!main.areaSqft){out.note='Google has no roof sections for this address. Type the roof size below.';return out;}
        var sum=(main.segments||[]).length;
        out.roofs=[{n:'Main Roof',s:main.areaSqft,p:Math.round(main.pitch12)+'/12',f:main.facets}];out.segments=main.facets;out.source='solar';
        out.imageryDate=main.imageryDate||'';out.quality=main.quality||'';
        if(main.lowSlopePct>15)out.note='About '+main.lowSlopePct+'% of this roof is low-slope or flat. Check if it needs a different roof system.';
        if(main.center){var dLat=(main.center.latitude-lat)*111320,dLng=(main.center.longitude-lng)*111320*Math.cos(lat*Math.PI/180);
          if(Math.sqrt(dLat*dLat+dLng*dLng)>30)out.note=(out.note?out.note+' ':'')+'The closest building Google found is not right at the address pin. Check the map.';
          out.lat=main.center.latitude;out.lng=main.center.longitude;}
        if(main.areaSqft<300)return out;
        // Other roofs on the lot (detached garage, barn, shed, attached section), like the website
        return scan.scan(main,{lat:lat,lng:lng}).then(function(res){
          var used={};
          out.parcel=res.parcel&&res.parcel.rings&&res.parcel.rings.length?res.parcel.rings:null;
          if(main.footprint&&main.footprint.rings)out.shapes.push({rings:main.footprint.rings,label:'Main Roof',main:true});
          (res.extras||[]).forEach(function(x){
            var r=x.roof,name=roofName(x.kind,used),row={n:name,s:r.areaSqft,p:Math.round(r.pitch12)+'/12',f:r.facets||2};
            var info={n:name,s:r.areaSqft,p:row.p,dist:x.distFt,dir:x.dir,est:!!r.noSat,row:row};
            if(r.footprint&&r.footprint.rings)out.shapes.push({rings:r.footprint.rings,label:name});
            if(r.slope==='flat'||r.pitch12<=1){out.flat.push(info);return;}
            if(x.include){out.roofs.push(row);out.extras.push(info);}else out.nearby.push(info);
          });
          return out;
        }).catch(function(){return out;});
      }).catch(function(er){
        var st=/solar-(\d+)/.exec(String(er&&er.message||''));
        if(st&&st[1]==='404'){out.note='Google has no roof data for this address. Type the roof size below.';return out;}
        if(st&&st[1]==='403'){out.note='Google blocked roof measuring for this key on the app. In Google Cloud, add teamsforte.github.io/* to the key’s website restrictions.';return out;}
        if(st){out.note='Couldn’t measure the roof right now ('+st[1]+'). Type the roof size below.';return out;}
        throw er;
      });
    }).catch(function(er){
      if(er&&/API key not valid|API_KEY_INVALID|InvalidKey/i.test(String(er.message||er)))throw new Error('The saved Google key isn’t right. Go to Quote prices and tap “Use my website’s key”.');
      if(er&&er.message==='KEY_BLOCKED')throw new Error('Google turned down the Maps key on the app. Under Quote prices, tap “Use my website’s key”. If it still fails, add teamsforte.github.io/* to that key’s website restrictions in Google Cloud.');
      throw er;
    });
  }

  function uploadInsp(quoteId,files,tag,note){
    S.upload={total:files.length,done:0,failed:0};drawProg();var errs=[];var seq=Promise.resolve();

      return call('addInspection',{quoteId:quoteId,base64:sh.base64,tag:tag,note:note}).then(function(r){S.prev[r.id]=sh.thumb;(M.inspections=M.inspections||[]).push(r);});
    }).catch(function(e){S.upload.failed++;errs.push(e.message);}).then(function(){S.upload.done++;drawProg();});});});
    seq.then(function(){var u=S.upload;S.upload=null;drawProg();render();toast(u.failed?u.failed+' didn’t upload: '+errs[0]:u.total+' photo'+(u.total===1?'':'s')+' added',!!u.failed);});

        '<button type="button" class="btn ghost block mt" data-m="ghltest">Check connection</button></div>';
      h+='<div class="card"><h2>People &amp; logins</h2><p class="hint">Your setup passcode is the owner login. Office: everything except logins and keys. Crew: their jobs and photos only, no prices.</p><div id="people"><div class="loading" style="padding:12px"><div class="spin dk"></div></div></div>'+
        '<div class="acts"><button type="button" class="btn ghost" data-m="addperson">'+ICON.plus+'Add person</button><button type="button" class="btn dark" data-m="savepeople">Save people</button></div></div>';
    }
    return h;
  }
  function personRow(u){return '<div class="row person" style="margin-top:8px" data-id="'+esc(u.id||'')+'"><input class="in" data-pn placeholder="Name" value="'+esc(u.name||'')+'"><select class="in" data-pr style="flex:0 0 96px"><option value="crew"'+(u.role!=='office'?' selected':'')+'>Crew</option><option value="office"'+(u.role==='office'?' selected':'')+'>Office</option></select><input class="in" data-pp placeholder="PIN" style="flex:0 0 96px" value="'+esc(u.pin||'')+'"></div>';}
  function loadPeople(){var box=document.getElementById('people');if(!box)return;call('users').then(function(list){box=document.getElementById('people');if(box)box.innerHTML=list.length?list.map(personRow).join(''):'<p class="hint" id="nopeople">No one yet.</p>';}).catch(err);}
  function extraSettingsArgs(f){
    var el=f.elements;var sw=function(n){var b=f.querySelector('[data-sw="'+n+'"]');return b?b.classList.contains('on'):undefined;};
    var a={company:{name:el.co_name.value,legal:el.co_legal.value,address:el.co_address.value,phone:el.co_phone.value,email:el.co_email.value,hic:el.co_hic.value},
      depositPct:el.depositPct.value,depositLink:el.depositLink.value,terms:el.terms.value,crewDayRate:el.crewDayRate.value,dumpster:el.dumpster.value,permit:el.permit.value,
      reviewLink:el.reviewLink.value,warrantyLink:el.warrantyLink.value,autoReview:sw('autoReview')};
    if(el.ghlToken){if(el.ghlToken.value.trim())a.ghlToken=el.ghlToken.value.trim();a.ghl={enabled:sw('ghlEnabled')};
      ['pipelineId','stageQuote','stageWon'].forEach(function(k2){if(el['g_'+k2])a.ghl[k2]=el['g_'+k2].value;});}
    return a;
  }

  /* ----- repair book on the Quote prices screen ----- */
  function repairBookCard(){
    var r=M.repairs;
    return '<div class="card"><h2>Repair prices</h2><div class="row"><div><label class="f">Minimum service charge</label><input class="in money" id="rbmin" inputmode="decimal" value="'+r.min+'"></div></div>'+
      '<div id="rbrows">'+r.items.map(rbRow).join('')+'</div><button type="button" class="btn ghost block mt" data-m="rbadd">'+ICON.plus+'Add repair</button></div>';
  }
  function rbRow(it){return '<div class="row rb" style="margin-top:8px" data-key="'+esc(it.key||'')+'"><input class="in" data-rn value="'+esc(it.name||'')+'" placeholder="Repair"><input class="in" data-ru style="flex:0 0 70px" value="'+esc(it.unit||'each')+'"><input class="in money" data-rp style="flex:0 0 84px" inputmode="decimal" value="'+(it.price!=null?it.price:'')+'" placeholder="$"></div>';}
  function readRepairBook(){
    var items=[];document.querySelectorAll('#rbrows .rb').forEach(function(r){var n=r.querySelector('[data-rn]').value.trim();if(!n)return;items.push({key:r.getAttribute('data-key')||'',name:n,unit:r.querySelector('[data-ru]').value.trim()||'each',price:Number(r.querySelector('[data-rp]').value)||0});});
    return {min:Number((document.getElementById('rbmin')||{}).value)||0,items:items};
  }

  /* ---------- clicks ---------- */
  function click(t,ev){
    if(ev&&t.tagName==='A'&&t.getAttribute('href')==='#')ev.preventDefault();
    var a=t.getAttribute('data-m');
    if(a==='retry'){M.failed=false;render();return;}
    if(a==='editcust'){editCustSheet();return;}
    if(a==='ghlsync'){call('ghlSyncNow',{id:M.qid}).then(function(r){mergeQ(r);render();toast('Synced to GoHighLevel');}).catch(function(e){load().then(render);err(e);});return;}
    if(a==='edititems'){editItemsSheet();return;}
    if(a==='approverep'){t.disabled=true;saveQ({status:'approved'},'Approved').then(function(){M.qfilter='approved';call('list').then(function(d){S.jobs=d.jobs||[];cacheMerge('list',d);});}).catch(function(){t.disabled=false;});return;}
    if(a==='propose'){proposeSheet();return;}
    if(a==='savesched'){saveQ({installDate:document.getElementById('sd').value,crew:document.getElementById('sc').value},'Schedule saved');return;}
    if(a==='editcosts'){costsSheet();return;}
    if(a==='addinsp'){addInspSheet(M.qid);return;}
    if(a==='insp'){inspSheet(t.getAttribute('data-id'));return;}
    if(a==='report'){reportSheet();return;}
    if(a==='revmail'){t.disabled=true;call('reviewEmail',{id:M.qid}).then(function(r){mergeQ(r);render();toast('Review request sent');}).catch(function(e){t.disabled=false;err(e);});return;}
    if(a==='warranty'){var wx=q();saveQ({warrantyDone:!wx.warrantyDone},!wx.warrantyDone?'Warranty marked registered':'Saved');return;}
    if(a==='openjobq'){S.tab='quotes';store('tfp_tab','quotes');M.qid=t.getAttribute('data-id');M.view='quote';render();window.scrollTo(0,0);return;}
    if(a==='crewopen'){M.qid=t.getAttribute('data-id');M.view='crewjob';render();window.scrollTo(0,0);return;}
    if(a==='crewback'){M.view='list';render();window.scrollTo(0,0);return;}
    if(a==='crewreload'){M.crewLoaded=false;render();return;}
    if(a==='crewphotos'){var cj=M.crewJobs.filter(function(z){return z.id===M.qid;})[0];S.tab='photos';store('tfp_tab','photos');S.jobId=cj.photoJobId;S.view='job';
      if(!S.jobs.some(function(j){return j.id===cj.photoJobId;}))call('list').then(function(d){S.jobs=d.jobs||[];cacheMerge('list',d);render();});render();window.scrollTo(0,0);return;}
    if(a==='crewinsp'){addInspSheet(M.qid);return;}
    if(a==='crewnote'){var ni=document.getElementById('cnote');var nv=ni.value.trim();if(!nv)return;t.disabled=true;
      call('crewNote',{id:M.qid,note:nv}).then(function(){var cj2=M.crewJobs.filter(function(z){return z.id===M.qid;})[0];cj2.events=(cj2.events||[]).concat([{e:'crew: '+nv+' ('+S.user.name+')',t:new Date().toISOString()}]);render();toast('Sent to the office');}).catch(function(e){t.disabled=false;err(e);});return;}
    if(a==='ghltest'){var gf=document.getElementById('sf');t.disabled=true;
      saveSettings(gf,(document.querySelector('#aenv .on')||{getAttribute:function(){return 'sandbox';}}).getAttribute('data-env')).then(function(){return call('ghlPipelines');}).then(function(list){
        var g=M.settings.ghl||{};var box=document.getElementById('ghlsel');
        function sel(name,opts,cur){return '<select class="in" name="'+name+'">'+opts.map(function(o){return '<option value="'+esc(o.id)+'"'+(o.id===cur?' selected':'')+'>'+esc(o.name)+'</option>';}).join('')+'</select>';}
        var pl=list.filter(function(x){return x.id===g.pipelineId;})[0]||list[0];
        if(box&&pl)box.innerHTML='<label class="f">Pipeline</label>'+sel('g_pipelineId',list,g.pipelineId)+'<label class="f">When a quote is sent</label>'+sel('g_stageQuote',pl.stages,g.stageQuote)+'<label class="f">When a job is approved</label>'+sel('g_stageWon',pl.stages,g.stageWon);
        toast('GoHighLevel is connected');}).catch(function(e){if(e.message!=='bad')err(e);}).then(function(){var b=document.querySelector('[data-m=ghltest]');if(b)b.disabled=false;});return;}
    if(a==='addperson'){var pb=document.getElementById('people');var np=document.getElementById('nopeople');if(np)np.remove();pb.insertAdjacentHTML('beforeend',personRow({role:'crew'}));return;}
    if(a==='savepeople'){var ppl=[];document.querySelectorAll('#people .person').forEach(function(r){var nm=r.querySelector('[data-pn]').value.trim(),pn=r.querySelector('[data-pp]').value.trim();if(!nm&&!pn)return;ppl.push({id:r.getAttribute('data-id')||undefined,name:nm,role:r.querySelector('[data-pr]').value,pin:pn});});
      t.disabled=true;call('saveUsers',{users:ppl}).then(function(){loadPeople();toast('People saved');}).catch(err).then(function(){t.disabled=false;});return;}
    if(a==='rbadd'){document.getElementById('rbrows').insertAdjacentHTML('beforeend',rbRow({unit:'each'}));return;}
    if(a==='newest'){newEst();M.view='new';render();window.scrollTo(0,0);var ea=document.getElementById('ea');if(ea)ea.focus();return;}
    if(a==='pricing'){M.view='pricing';render();window.scrollTo(0,0);return;}
    if(a==='measure'){measure();return;}
    if(a==='colors'){colorBook(1,null,'');return;}
    if(a==='addroof'){M.est.roofs.push({n:M.est.roofs.length===1?'Garage':'Section '+(M.est.roofs.length+1),s:0,p:'4/12'});render();return;}
    if(a==='rmroof'){M.est.roofs.splice(+t.getAttribute('data-i'),1);render();return;}
    if(a==='addnear'){var nx=M.est.m&&M.est.m.nearby&&M.est.m.nearby[+t.getAttribute('data-i')];if(nx){M.est.roofs.push({n:nx.row.n,s:nx.row.s,p:nx.row.p,f:nx.row.f});M.est.m.nearby.splice(+t.getAttribute('data-i'),1);}render();return;}
    if(a==='saveest'){saveEst(t.getAttribute('data-v')==='email');return;}
    if(a==='share'){shareSheet();return;}
    if(a==='qf'){M.qfilter=t.getAttribute('data-v');render();return;}
    if(a==='addlink'){addLinkSheet();return;}
    if(a==='openq'){M.qid=t.getAttribute('data-id');M.view='quote';M.draft=null;render();window.scrollTo(0,0);return;}
    if(a==='back'){M.view='list';render();window.scrollTo(0,0);return;}
    if(a==='approve'){approve();return;}
    if(a==='archive'){confirmBox('Archive this quote?','It will be hidden from your Quotes list. Orders already placed are kept.','Archive').then(function(ok){if(!ok)return;
      call('deleteQuote',{id:M.qid}).then(function(){M.quotes=M.quotes.filter(function(x){return x.id!==M.qid;});M.view='list';render();toast('Archived');}).catch(err);});return;}
    if(a==='recalc'){recalc();return;}
    if(a==='line'){lineSheet(+t.getAttribute('data-i'));return;}
    if(a==='addline'){addLineSheet();return;}
    if(a==='editjob'){editJobSheet();return;}
    if(a==='status'){saveQ({status:t.getAttribute('data-v')},t.getAttribute('data-v')==='done'?'Marked done':'Reopened');return;}
    if(a==='photos'){var x=q();S.tab='photos';store('tfp_tab','photos');S.jobId=x.photoJobId;S.view='job';
      if(!S.jobs.some(function(j){return j.id===x.photoJobId;}))call('list').then(function(d){S.jobs=d.jobs||[];cacheMerge('list',d);render();});render();window.scrollTo(0,0);return;}
    if(a==='order'){orderSheet(t.getAttribute('data-v'));return;}
    if(a==='openo'){orderDetail(t.getAttribute('data-id'));return;}
    if(a==='mtab'){M.money=t.getAttribute('data-v');render();return;}
    if(a==='price'){priceSheet(t.getAttribute('data-k'));return;}
    if(a==='refresh'){t.disabled=true;t.textContent='Refreshing…';call('refreshPrices').then(function(r){return load().then(function(){render();toast(r.updated+' prices updated'+(r.failed.length?', '+r.failed.length+' failed':''));});}).catch(function(e){render();err(e);});return;}
    if(a==='settings'){M.mview='settings';render();window.scrollTo(0,0);return;}
    if(a==='mhome'){M.mview='home';render();window.scrollTo(0,0);return;}
    if(a==='addsup'){document.getElementById('sups').insertAdjacentHTML('beforeend',supRow({name:'',email:''}));return;}
    if(a==='abctest'){var f=document.getElementById('sf');t.disabled=true;
      saveSettings(f,document.querySelector('#aenv .on').getAttribute('data-env')).then(function(){return call('abcTest');}).then(function(r){toast('ABC login works ('+(r.env==='production'?'Live':'Test')+')');})
        .catch(function(e){if(e.message!=='bad')err(e);}).then(function(){var b=document.querySelector('[data-m=abctest]');if(b)b.disabled=false;});return;}
    if(a==='branches'){var box=document.getElementById('brs');box.innerHTML='<div class="loading" style="padding:16px"><div class="spin dk"></div></div>';
      saveSettings(document.getElementById('sf'),document.querySelector('#aenv .on').getAttribute('data-env')).then(function(){return call('abcBranches',{state:'CT'});}).then(function(list){
        box=document.getElementById('brs');
        box.innerHTML=list.length?list.map(function(b){return '<button type="button" class="res" data-m="pickbr" data-n="'+esc(b.number)+'" data-nm="'+esc(b.name||b.city)+'"><b>'+esc(b.name||'Branch '+b.number)+'</b><span>#'+esc(b.number)+' · '+esc(b.city)+'</span></button>';}).join(''):'<p class="hint">No branches found.</p>';
      }).catch(function(e){var bx=document.getElementById('brs');if(bx)bx.innerHTML='';if(e.message!=='bad')err(e);});return;}
    if(a==='pickbr'){var fm=document.getElementById('sf');fm.elements.branch.value=t.getAttribute('data-n');fm.elements.branchName.value=t.getAttribute('data-nm');document.getElementById('brs').innerHTML='';toast('Branch picked. Tap Save settings.');return;}
    if(a==='hook'){t.disabled=true;call('abcRegisterWebhook').then(function(r){M.settings=r;render();toast('Order updates turned on');}).catch(function(e){t.disabled=false;err(e);});return;}
    if(a==='disc'){confirmBox('Disconnect ABC Supply?','Your ABC login is removed from the app. Prices and past orders stay.','Disconnect').then(function(ok){if(!ok)return;
      call('saveSettings',{abc:{disconnect:true}}).then(function(r){M.settings=r;render();toast('Disconnected');}).catch(err);});return;}
  }

  return {
    render:renderMat, click:click, load:load, loadCrew:loadCrew, apply:apply, applyCrew:applyCrew,
    reset:function(){M.loaded=false;M.quotes=[];M.orders=[];M.prices=[];M.view='list';M.mview='home';},
    home:function(){M.view='list';M.mview='home';},
    newCount:function(){return M.quotes.filter(function(x){return x.status==='new';}).length;}
  };
})();


/* ---------- start ---------- */
function cacheMerge(part,d){var c=cacheGet('boot');if(c){c[part]=d;cacheSet('boot',c);}}
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
var saved=load('tfp_pass');
if(saved){S.pass=saved;boot();}else{render();}
})();
</script>
</body>
</html>
